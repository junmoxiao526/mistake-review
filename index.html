    });
}

function extractAnswerLetters(answer) {
  if (!answer) return [];
  const m = String(answer).match(/[A-Ea-e]/g);
  if (!m) return [];
  const seen = {}, letters = [];
  m.forEach(function (ch) {
    const up = ch.toUpperCase();
    if (!seen[up]) { seen[up] = 1; letters.push(up); }
  });
  return letters;
}

function checkOptionAnswer(optEl) {
  const id = optEl.dataset.id;
  const optLetter = (optEl.dataset.opt || "").toUpperCase();
  const card = optEl.closest(".question-card");
  const q = allQuestions.find(function (item) { return item.id === id; });
  if (!q || !card) return;

  // 再次点击已作答的选项：取消本次作答高亮
  if (optEl.classList.contains("selected") || optEl.classList.contains("correct") || optEl.classList.contains("wrong")) {
    card.querySelectorAll(".q-option").forEach(function (el) {
      el.classList.remove("selected", "correct", "wrong");
    });
    return;
  }

  const correctLetters = extractAnswerLetters(q.answer);
  if (correctLetters.length === 0) {
    alert("该题未设置答案，请先编辑填写");
    return;
  }

  // 重新选择：清除本卡片的旧作答状态
  card.querySelectorAll(".q-option").forEach(function (el) {
    el.classList.remove("selected", "correct", "wrong");
  });
  optEl.classList.add("selected");

  if (correctLetters.indexOf(optLetter) >= 0) {
    optEl.classList.add("correct");
    // 选对：掌握状态归为已掌握；复习计划阶段推进
    onReviewAnswer(id, true);
    const curM = q.mastery || "未掌握";
    if (curM !== "已掌握") {
      setAnswerMastery(id, "已掌握", !!state.filters.mastery);
    }
  } else {
    optEl.classList.add("wrong");
    card.querySelectorAll(".q-option").forEach(function (el) {
      const l = (el.dataset.opt || "").toUpperCase();
      if (correctLetters.indexOf(l) >= 0) el.classList.add("correct");
    });
    // 选错：复习计划重置回第 1 天；当前筛选为"未掌握"时归入需复习，否则归入未掌握
    onReviewAnswer(id, false);
    const curM2 = q.mastery || "未掌握";
    const targetM = state.filters.mastery === "未掌握" ? "需复习" : "未掌握";
    if (curM2 !== targetM) {
      setAnswerMastery(id, targetM, !!state.filters.mastery);
    }
  }
}

function scopeLabel() {
  const f = state.filters;
  const kw = f.keyword ? ("关键字:" + f.keyword) : "";
  const parts = [f.category, f.type, f.mastery, kw].filter(Boolean);
  return parts.join(" / ") || "全部";
}

function buildPrintHtml(qs) {
  const date = new Date().toISOString().slice(0, 10);
  const parts = [];
  parts.push('<div class="print-title">WaytoGWY 错题复盘导出</div>');
  parts.push('<div class="print-subtitle">共 ' + qs.length + ' 道错题 | ' + scopeLabel() + ' | ' + date + '</div>');
  qs.forEach(function (q, i) {
    let html = '<div class="pq">';
    html += '<div class="pq-text">' + (i + 1) + '. ' + formatQuestionText(q) + '</div>';
    splitOptions(q.options).forEach(function (o) {
      html += '<div class="pq-opt">' + esc(o) + '</div>';
    });
    html += '<hr class="pq-divider">';
    html += '</div>';
    parts.push(html);
  });
  return parts.join("");
}

// 手写圈画：状态与事件
let drawSession = null;

function captureQuestionCard(card, btn) {
  if (!card) return;
  const noEl = card.querySelector(".q-no");
  const no = noEl ? noEl.textContent.trim().replace(/\s+/g, "") : "";
  const oldText = btn ? btn.textContent : "";
  if (btn) {
    btn.disabled = true;
    btn.textContent = "截图中…";
  }
  loadHtml2Canvas().then(function (h2c) {
    card.classList.add("capturing");
    const w = card.scrollWidth, h = card.scrollHeight;
    return h2c(card, {
      backgroundColor: null,
      scale: Math.min(2, window.devicePixelRatio || 1),
      width: w, height: h,
      windowWidth: document.documentElement.clientWidth,
      useCORS: true
    }).then(function (canvas) {
      card.classList.remove("capturing");
      const a = document.createElement("a");
      a.download = "错题_" + (no || "题目") + ".png";
      a.href = canvas.toDataURL("image/png");
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  }).catch(function (err) {
    card.classList.remove("capturing");
    alert(err && err.message ? err.message : "截图失败，请重试");
  }).finally(function () {
    if (btn) {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  });
}

function openDrawMode(btn) {
  const card = btn.closest(".question-card");
  if (!card) return;
  openDrawSession(card, "qdraw_" + btn.dataset.id);
}

function openMatDrawMode(btn) {
  const mat = btn.closest(".group-material");
  if (!mat) return;
  openDrawSession(mat, "qdraw_mat_" + encodeURIComponent(String(btn.dataset.materialGroup || "")));
}

// 通用圈画会话：题干卡片 / 材料容器（.group-material）共用；storageKey 决定存取维度
function openDrawSession(container, storageKey) {
  finishDrawSession();
  if (!container) return;
  const img = container.querySelector(".q-draw-img");
  const canvas = container.querySelector(".q-draw-canvas");
  const toolbar = container.querySelector(".q-draw-toolbar");
  const w = container.clientWidth, h = container.clientHeight;
  if (!w || !h || !canvas || !toolbar) return;
  // 高分屏适配：物理像素按 devicePixelRatio 放大，绘制坐标仍用 CSS 像素（setTransform 缩放），
  // 否则 iPad/Retina 上画布只有一半物理像素，笔迹被拉伸放大必然发虚、看不清
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  let saved = null;
  try { saved = localStorage.getItem(storageKey) || null; } catch (err) { saved = null; }
  if (saved) {
    const im = new Image();
    im.onload = function () { ctx.drawImage(im, 0, 0, w, h); };
    im.src = saved;
  }
  container.classList.add("q-draw-active");
  document.body.classList.add("q-draw-global"); // 全局禁止文本选择，防系统浮层
  drawSession = {
    id: null, storageKey: storageKey, card: container, img: img, canvas: canvas, toolbar: toolbar, ctx: ctx,
    color: "#ef4444", size: getDrawSizePref(), erasing: false, drawing: false, interrupted: false,
    scrollLock: null
  };
  // 激活即锁定滚动链：圈画会话期间禁止页面滚动，空档（抬笔再落笔）不会被系统识别为滚动手势抢走事件流
  drawSession.scrollLock = lockScrollChain(container);
  img.style.display = "none";
  canvas.classList.add("active");
  toolbar.classList.add("open");
  setDrawToolbarState();
}

// 圈画激活期间锁定祖先滚动链（overflow 容器临时 touch-action:none），
// 防止系统手势抢占滚动导致 pointercancel；finish 时恢复原值
function lockScrollChain(container) {
  const saved = [];
  // 关键：必须把 body/html 也纳入锁定（document 级滚动）。iPad/Edge 上笔抬起后
  // 浏览器会把后续移动识别为页面滚动手势并抢走指针事件，只有锁住根滚动才能保证续接不断触。
  let el = container.parentElement;
  while (el) {
    let cs = null;
    try { cs = getComputedStyle(el); } catch (err) {}
    if (cs) {
      const o = (cs.overflowY + " " + cs.overflowX).toLowerCase();
      const isDocRoot = el === document.body || el === document.documentElement;
      if (isDocRoot || o.indexOf("auto") >= 0 || o.indexOf("scroll") >= 0) {
        saved.push({ el: el, val: el.style.touchAction });
        el.style.touchAction = "none";
      }
    }
    el = el.parentElement;
  }
  return saved;
}
function restoreScrollChain(saved) {
  if (!saved) return;
  saved.forEach(function (it) { it.el.style.touchAction = it.val; });
}

function setDrawToolbarState() {
  if (!drawSession) return;
  const tb = drawSession.toolbar;
  tb.querySelector('[data-action="color-red"]').classList.toggle("active", drawSession.color === "#ef4444");
  tb.querySelector('[data-action="color-black"]').classList.toggle("active", drawSession.color === "#000000");
  const slider = tb.querySelector(".q-draw-size");
  if (slider) slider.value = String(drawSession.size);
  const label = tb.querySelector(".q-draw-size-label");
  if (label) label.textContent = drawSession.size + "px";
  tb.querySelector('[data-action="eraser"]').classList.toggle("active", drawSession.erasing);
}

function finishDrawSession() {
  if (!drawSession) return;
  stylusStrokeActive = false; // 清理 stylus 兜底通道状态，防止残留
  const s = drawSession;
  try {
    const dataUrl = s.canvas.toDataURL("image/png");
    localStorage.setItem(s.storageKey, dataUrl);
    s.img.src = dataUrl;
    s.img.style.display = "";
  } catch (err) {
    console.warn("保存圈画失败", err);
  }
  s.canvas.classList.remove("active");
  s.toolbar.classList.remove("open");
  if (s.card) s.card.classList.remove("q-draw-active");
  document.body.classList.remove("q-draw-global"); // 恢复全局文本选择
  restoreScrollChain(s.scrollLock);
  drawSession = null;
}

// 画笔粗细偏好：1~8px，持久化到 localStorage，题干与材料共用
const DRAW_SIZE_PREF_KEY = "qdraw_size_pref";
const DRAW_SIZE_MIN = 1, DRAW_SIZE_MAX = 8;
function getDrawSizePref() {
  try {
    const v = parseInt(localStorage.getItem(DRAW_SIZE_PREF_KEY), 10);
    if (v >= DRAW_SIZE_MIN && v <= DRAW_SIZE_MAX) return v;
  } catch (err) {}
  return 3; // 圆珠笔默认笔宽：3px，配合高分屏适配更圆润饱满
}
function saveDrawSizePref(v) {
  try { localStorage.setItem(DRAW_SIZE_PREF_KEY, String(v)); } catch (err) {}
}
// 滑块实时调节粗细
document.addEventListener("input", function (e) {
  const slider = e.target.closest(".q-draw-size");
  if (!slider || !drawSession) return;
  let v = parseInt(slider.value, 10);
  if (!(v >= DRAW_SIZE_MIN && v <= DRAW_SIZE_MAX)) v = 3;
  drawSession.size = v;
  saveDrawSizePref(v);
  const label = drawSession.toolbar.querySelector(".q-draw-size-label");
  if (label) label.textContent = v + "px";
});

// 圈画激活期间：滑块拖动手动接管
// 背景：lockScrollChain 激活即锁把容器 touch-action 设为 none，iPad 上原生 range 滑块拖动被浏览器禁用；
// 且全局 touchmove preventDefault 也会杀掉滑块拖动。这里检测触摸落在滑块区域时，
// 手动按触摸坐标换算笔宽并 preventDefault，绕开原生拖动限制。
let sliderDragTouch = false;
function drawSliderByClientX(clientX) {

document.addEventListener("pointerup", function () {

  if (drawSession) {

    drawSession.interrupted = false;

  }
});

function compressImage(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      try {
        const MAX = 2000;
        let w = img.naturalWidth, h = img.naturalHeight;
        const longest = Math.max(w, h);
        if (longest > MAX) {
          const scale = MAX / longest;
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const MAX_BYTES = 5 * 1024 * 1024;
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        while (dataUrl.length > (MAX_BYTES * 4) / 3 && quality > 0.4) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(dataUrl);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("图片加载失败"));
    };
    img.src = url;
  });
}

function compressAIImage(file, maxBytes) {
  maxBytes = maxBytes || 2 * 1024 * 1024;
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onerror = function () { reject(new Error("图片读取失败")); };
    fr.onload = function () {
      const raw = fr.result;
      if (raw.length <= maxBytes) return resolve(raw);
      const img = new Image();
      img.onerror = function () { reject(new Error("图片解析失败")); };
      img.onload = function () {
        const MAX_EDGE = 1280;
        let w = img.width, h = img.height;
        if (Math.max(w, h) > MAX_EDGE) {
          const ratio = MAX_EDGE / Math.max(w, h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let quality = 0.85;
        let out = canvas.toDataURL("image/jpeg", quality);
        while (out.length > maxBytes && quality > 0.4) {
          quality -= 0.15;
          out = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src = raw;
    };
    fr.readAsDataURL(file);
  });
}

function normalizeParsed(parsed) {
  if (!parsed) return parsed;
  var qLines = String(parsed.question || "").split("\n");
  var optLines = String(parsed.options || "").split("\n");
  var moved = [], kept = [];
  qLines.forEach(function (line) {
    if (/^[A-E]\s*[.、．)）]/.test(line)) moved.push(line);
    else kept.push(line);
  });
  optLines.forEach(function (line) {
    if (line.trim()) moved.push(line);
  });
  var seen = {}, merged = [];
  moved.forEach(function (line) {
    var m = line.match(/^([A-E])\s*[.、．)）]/);
    if (m) {
      var letter = m[1].toUpperCase();
      if (seen[letter]) return;
      seen[letter] = true;
    }
    merged.push(line);
  });
  var newQuestion = kept.join("\n").trim();
  if (newQuestion) parsed.question = newQuestion;
  parsed.options = merged.join("\n");
  return parsed;
}

  if (drawSession) return; // 圈画期间不显示释义浮层
  const w = e.target && e.target.closest ? e.target.closest(".dict-word") : null;
  if (!w) return;
  const word = w.getAttribute("data-w");
  const def = window.IDIOM_DICT && window.IDIOM_DICT[word];
  if (!def) return;
  const tip = getDictTip();
  tip.innerHTML = '<span class="dict-tip-word">' + word + '</span>' + esc(def);
  tip.style.display = "block";
  const r = w.getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left;
  let top = r.bottom + 6;
  if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
  if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 6);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
});
document.addEventListener("mouseout", function (e) {
  const w = e.target && e.target.closest ? e.target.closest(".dict-word") : null;
  if (!w) return;
  const rel = e.relatedTarget;
  if (rel && rel.closest && rel.closest(".dict-tip, .dict-word")) return;
  hideDictTip();
});

// 选中文本跳转搜索浮层（事件委托 + 全局监听，纯前端零依赖）
const SEARCH_ENGINES = [
  { label: "百度搜索", url: "https://www.baidu.com/s?wd=" },
  { label: "必应搜索", url: "https://www.bing.com/search?q=" }
];
let _searchTip = null;
let _searchTipSel = null;
function getSearchTip() {
  if (!_searchTip) {
    _searchTip = document.createElement("div");
    _searchTip.className = "search-tip";
    _searchTip.setAttribute("role", "tooltip");
    document.body.appendChild(_searchTip);
    _searchTip.addEventListener("mousedown", function (e) {
      e.preventDefault(); // 防止点击按钮时丢失文本选区
    });
    SEARCH_ENGINES.forEach(function (se) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = se.label;
      btn.addEventListener("click", function () {
        const word = _searchTipSel;
        hideSearchTip();
        if (word && word.trim()) {
          window.open(se.url + encodeURIComponent(word.trim()), "_blank", "noopener");
        }
      });
      _searchTip.appendChild(btn);
    });
  }
  return _searchTip;
}
function hideSearchTip() {
  if (_searchTip) _searchTip.style.display = "none";
  _searchTipSel = null;
}
function isQuestionTextNode(node) {
  return !!(node && node.closest && node.closest(".q-text, .q-option, .answer-panel"));
}
function showSearchTip(sel) {
  const text = sel.toString().replace(/\s+/g, " ").trim();
  if (!text) { hideSearchTip(); return; }
  _searchTipSel = text;
  const tip = getSearchTip();
  tip.style.display = "block";
  const r = sel.getRangeAt(0).getBoundingClientRect();
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let left = r.left + r.width / 2 - tw / 2;
  let top = r.bottom + 10;
  if (left + tw > window.innerWidth - 8) left = Math.max(8, window.innerWidth - tw - 8);
  if (left < 8) left = 8;
  if (top + th > window.innerHeight - 8) top = Math.max(8, r.top - th - 10);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
document.addEventListener("mouseup", function (e) {
  if (drawSession) { hideSearchTip(); return; } // 圈画期间不显示选中搜索浮层
  if (_searchTip && _searchTip.style.display === "block" && e.target && _searchTip.contains(e.target)) return;
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSearchTip(); return; }
  const range = sel.getRangeAt(0);
  const container = range.commonAncestorContainer;
  const node = container.nodeType === 1 ? container : (container.parentNode || null);
  if (!isQuestionTextNode(node)) { hideSearchTip(); return; }
  hideDictTip(); // 出现文本选区时隐藏释义浮层，避免两个浮层叠放
  showSearchTip(sel);
});
document.addEventListener("selectionchange", function () {
  const sel = window.getSelection && window.getSelection();
  if (drawSession) {
    // 圈画激活期间：任何选区立即清除，并隐藏选中搜索/释义浮层，避免干扰笔迹
    if (sel && sel.rangeCount > 0 && !sel.isCollapsed) sel.removeAllRanges();
    hideSearchTip();
    hideDictTip();
    return;
  }
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSearchTip(); return; }
});
document.addEventListener("mousedown", function (e) {
  if (_searchTip && _searchTip.style.display === "block") {
    if (e.target === _searchTip || (_searchTip.contains && _searchTip.contains(e.target))) return;
    hideSearchTip(); // 点击其他空白处时浮层消失
  }
});

</script>
