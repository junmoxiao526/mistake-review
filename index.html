<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复盘平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #f0f4fb;
  --bg2: #f8fafc;
  --card: #ffffff;
  --primary: #3b6ef5;
  --primary-2: #6d8dff;
  --primary-deep: #2f5cd8;
  --primary-soft: #eef2ff;
  --border: #e4e9f2;
  --border-soft: #eef1f7;
  --text: #1f2937;
  --muted: #6b7280;
  --red: #e5484d;
  --green: #18a058;
  --amber: #d98a00;
  --shadow-sm: 0 1px 2px rgba(30,41,59,.04), 0 1px 3px rgba(30,41,59,.06);
  --shadow-md: 0 4px 12px rgba(30,41,59,.06), 0 2px 4px rgba(30,41,59,.04);
  --shadow-lg: 0 12px 28px rgba(30,41,59,.10), 0 4px 10px rgba(30,41,59,.06);
  --radius: 15px;
  --radius-sm: 10px;
  --grad-primary: linear-gradient(135deg, #3b6ef5 0%, #6d8dff 100%);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: linear-gradient(160deg, #f0f4fb 0%, #f8fafc 100%);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
}
header {
  background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
  color: #fff;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 18px rgba(15,23,42,.28);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
header h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
header .sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 10px; padding: 9px 16px;
  font-size: 14px; cursor: pointer; transition: all .2s ease;
  font-family: inherit;
}
.btn-primary {
  background: var(--grad-primary); color: #fff;
  box-shadow: 0 4px 12px rgba(59,110,245,.35);
}
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(59,110,245,.45); filter: brightness(1.05); }
.btn-primary:active { transform: translateY(0); }
.btn-ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.14); }
.btn-ghost:hover { background: rgba(255,255,255,.22); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 4px 12px rgba(59,110,245,.15); transform: translateY(-1px); }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow-md); border: 1px solid var(--border-soft);
  position: relative; overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.stat-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--bar, var(--primary));
}
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.stat-card .num {
  font-size: 28px; font-weight: 800; letter-spacing: .5px;
  background: var(--grad-primary); -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat-card.total { --bar: var(--primary); }
.stat-card.weak { --bar: var(--red); }
.stat-card.ok { --bar: var(--green); }
.stat-card.review { --bar: var(--amber); }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.chart-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow-md); border: 1px solid var(--border-soft);
  transition: transform .2s ease, box-shadow .2s ease;
}
.chart-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.bar-row .name {
  flex: 0 0 150px; text-align: right; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bar-track { flex: 1; background: #f0f1f3; border-radius: 6px; height: 22px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width .3s; display: flex; align-items: center; }
.bar-row .cnt { flex: 0 0 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-fill span { color: #fff; font-size: 11px; padding: 0 8px; font-weight: 600; }
.pie-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.pie-svg { width: 240px; height: 222px; flex: 0 0 auto; }
.pie-svg path { cursor: pointer; transition: opacity .2s ease; }
.pie-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
.pie-legend-item {
  display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
  border-radius: 10px; padding: 5px 8px; transition: all .18s ease;
}
.pie-legend-item:hover { background: #f1f5ff; }
.pie-legend-item.active { background: var(--primary-soft); box-shadow: inset 0 0 0 1px rgba(59,110,245,.25); }
.pie-legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.pie-legend-name { color: var(--text); flex: 0 0 auto; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pie-legend-val { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.filter-bar {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: var(--shadow-md); border: 1px solid var(--border-soft);
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 22px;
  transition: box-shadow .2s ease;
}
.filter-bar:hover { box-shadow: var(--shadow-lg); }
.filter-item { display: flex; align-items: center; gap: 8px; }
.filter-item label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.filter-item select {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 13px; background: #fff; cursor: pointer; font-family: inherit;
  min-width: 150px; color: var(--text); transition: all .18s ease;
}
.filter-item select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,110,245,.18); }
.filter-item input {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 13px; background: #fff; font-family: inherit;
  min-width: 230px; color: var(--text); transition: all .18s ease;
}
.filter-item input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,110,245,.18); }
.filter-count { margin-left: auto; font-size: 13px; color: var(--muted); }

.question-card {
  background: var(--card); border-radius: var(--radius); padding: 20px 22px;
  box-shadow: var(--shadow-md); border: 1px solid var(--border-soft); margin-bottom: 14px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.question-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.q-no {
  font-weight: 800; font-size: 15px; color: #fff;
  background: var(--grad-primary); border-radius: 8px; padding: 2px 9px;
  box-shadow: 0 2px 6px rgba(59,110,245,.3);
}
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500;
}
.tag-cat { background: var(--primary-soft); color: #4f46e5; }
.tag-cat-edit { cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
.tag-cat-edit:hover { background: #dbe3ff; box-shadow: 0 0 0 1px #4f46e5; }
.cat-chip {
  border: 1px solid var(--border); background: #fff; color: var(--text);
  border-radius: 20px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  transition: all .18s ease; font-family: inherit;
}
.cat-chip:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 8px rgba(59,110,245,.12); }
.cat-chip.active { background: var(--primary-soft); border-color: #4f46e5; color: #4f46e5; font-weight: 600; }
.category-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.q-text { font-size: 15px; font-weight: 500; margin-bottom: 10px; }
.q-options { margin-bottom: 10px; }
.q-option {
  font-size: 14px; padding: 5px 0 5px 18px; color: #374151;
  border-radius: 6px;
}
.q-option:hover { background: #f9fafb; }
.q-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.mastery-group { display: flex; gap: 6px; }
.mastery-btn {
  border: 1px solid var(--border); background: #fff; color: var(--muted);
  border-radius: 20px; padding: 4px 13px; font-size: 12px; cursor: pointer;
  transition: all .18s ease; font-family: inherit;
}
.mastery-btn:hover { border-color: #c0c4cc; transform: translateY(-1px); }
.mastery-btn.weak.active { background: #fdecec; border-color: var(--red); color: var(--red); font-weight: 600; box-shadow: 0 2px 8px rgba(229,72,77,.18); }
.mastery-btn.ok.active { background: #e8f7ef; border-color: var(--green); color: var(--green); font-weight: 600; box-shadow: 0 2px 8px rgba(24,160,88,.18); }
.mastery-btn.review.active { background: #fdf3e0; border-color: var(--amber); color: var(--amber); font-weight: 600; box-shadow: 0 2px 8px rgba(217,138,0,.18); }
.show-answer-btn { margin-left: auto; }
.answer-panel {
  margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: #f8fafc; border: 1px solid var(--border); display: none;
}
.answer-panel.open { display: block; }
.answer-panel .row { font-size: 13px; margin-bottom: 6px; }
.answer-panel .row:last-child { margin-bottom: 0; }
.answer-panel .k { font-weight: 600; }
.answer-panel .ans { color: var(--green); font-weight: 600; }
.answer-panel .reason { color: #b45309; }
.answer-panel .analysis { color: #1d4ed8; }

.empty { text-align: center; color: var(--muted); padding: 50px 0; font-size: 14px; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
footer { text-align: center; color: #9ca3af; font-size: 12px; padding: 20px 0; }

/* 打印区（默认隐藏） */
#printArea { display: none; }

/* 打印样式：仿宋、纯黑、题号重标、选项缩进两字符 */
@page { margin: 2cm 1.8cm; }
@media print {
  header, #app { display: none !important; }
  #printArea { display: block !important; }
  body {
    background: #fff;
    font-family: "FangSong", "仿宋", "FangSong_GB2312", "STFangsong", serif;
    color: #000;
  }
  .print-title { font-size: 20pt; font-weight: bold; text-align: center; margin-bottom: 4pt; }
  .print-subtitle { font-size: 14pt; text-align: center; margin-bottom: 16pt; }
  .pq { margin-bottom: 10pt; page-break-inside: avoid; }
  .pq-text { font-size: 14pt; margin-bottom: 3pt; }
  .pq-opt { font-size: 13pt; padding-left: 2em; margin-bottom: 2pt; }
  .pq-ans { font-size: 12pt; margin-top: 4pt; }
  .pq-analysis { font-size: 12pt; margin-top: 2pt; }
  .pq-divider { border: none; border-top: 0.5pt solid #bbb; margin: 8pt 0; }
}

.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal-box { background: #fff; border-radius: 18px; width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; box-shadow: 0 24px 60px rgba(15,23,42,.28), 0 6px 18px rgba(15,23,42,.12); border: 1px solid var(--border-soft); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 16px; font-weight: 600; margin: 0; }
.modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; transition: color .15s; }
.modal-close:hover { color: var(--red); }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.upload-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.upload-hint { font-size: 12px; color: var(--muted); }
.upload-status { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }
.form-item { margin-bottom: 14px; }
.form-item label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.form-item textarea, .form-item input, .form-item select {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px;
  font-size: 14px; font-family: inherit; color: var(--text); background: #fff;
  transition: all .18s ease;
}
.form-item textarea:focus, .form-item input:focus, .form-item select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,110,245,.18); }

@media (max-width: 800px) {
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  .bar-row .name { flex-basis: 100px; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>错题复盘平台</h1>
    <div class="sub" id="headerSub">WaytoGWY 备考 · 云端多设备 / 答题练习 / 统计 / 打印导出</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btnUpload">拍照上传</button>
    <button class="btn btn-ghost" id="btnRefresh">刷新数据</button>
    <button class="btn btn-primary" id="btnExport">打印导出</button>
  </div>
</header>

<div class="container" id="app">
  <div class="stat-cards" id="statCards">
    <div class="stat-card total"><div class="num" id="stTotal">-</div><div class="label">错题总数</div></div>
    <div class="stat-card weak"><div class="num" id="stWeak">-</div><div class="label">未掌握</div></div>
    <div class="stat-card ok"><div class="num" id="stOk">-</div><div class="label">已掌握</div></div>
    <div class="stat-card review"><div class="num" id="stReview">-</div><div class="label">需复习</div></div>
  </div>

  <div class="charts">
    <div class="chart-card full"><h3>板块错题数</h3><div id="chartCategory"></div></div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <label>关键字</label>
      <input id="fKeyword" type="text" placeholder="搜索题干/选项/答案/解析">
    </div>
    <div class="filter-item">
      <label>板块</label>
      <select id="fCategory"><option value="">全部板块</option></select>
    </div>
    <div class="filter-item">
      <label>掌握状态</label>
      <select id="fMastery">
        <option value="">全部状态</option>
        <option value="未掌握">未掌握</option>
        <option value="已掌握">已掌握</option>
        <option value="需复习">需复习</option>
      </select>
    </div>
    <div class="filter-count" id="filterCount"></div>
  </div>

  <div id="list"></div>
  <footer>数据来自 Supabase 云端 · 掌握状态多设备同步 · 拍照上传 AI 识别</footer>
</div>

<div class="modal-mask" id="uploadModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3>拍照上传错题</h3>
      <button class="modal-close" id="btnUploadClose" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="upload-actions">
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
        <button class="btn btn-primary" id="btnPickImage" type="button">拍照 / 选择图片</button>
        <span class="upload-hint">支持相机拍照，AI 自动识别题干与选项</span>
      </div>
      <div class="upload-hint">AI 识别由智谱 GLM-4V-Flash 提供（免费）</div>
      <div class="upload-status" id="uploadStatus"></div>
      <div class="form-item">
        <label>题干</label>
        <textarea id="fQuestion" rows="4" placeholder="OCR 自动识别后回填"></textarea>
      </div>
      <div class="form-item">
        <label>选项</label>
        <textarea id="fOptions" rows="5" placeholder="OCR 自动识别后回填，每行一个选项"></textarea>
      </div>
      <div class="form-item">
        <label>答案</label>
        <input id="fAnswer" type="text" placeholder="手动填写，如 A / B / C / D">
      </div>
      <div class="form-item">
        <label>板块</label>
        <select id="fCategoryNew"><option value="">请选择板块</option></select>
      </div>
      <div class="form-item">
        <label>解析</label>
        <textarea id="fAnalysis" rows="3" placeholder="手动填写解析（可选）"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="btnUploadCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnUploadSave" type="button">保存错题</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="categoryModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3>编辑板块</h3>
      <button class="modal-close" id="btnCategoryClose" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-item">
        <label>板块名称</label>
        <input id="fCategoryEdit" type="text" placeholder="输入新板块名">
      </div>
      <div class="form-item">
        <label>快捷选择已有板块</label>
        <div class="category-quick" id="categoryQuickList"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="btnCategoryCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnCategorySave" type="button">保存</button>
    </div>
  </div>
</div>

<!-- 打印区 -->
<div id="printArea"></div>

<script>
const SUPABASE_URL = "https://kxspgfeglbogyrewbmuc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4c3BnZmVnbGJvZ3lyZXdibXVjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2OTc2NDYsImV4cCI6MjEwMjI3MzY0Nn0.K5FHUhGukuNvpfX1a8phmMHhSsnKw6p9myvTFqByrAw";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MASTERY_OPTIONS = ["未掌握", "已掌握", "需复习"];
const DEFAULT_MASTERY = "未掌握";
const MASTERY_KEY = "mistake_review_mastery_v1";

let isLocal = false;  // 本地后端环境（可访问 /api/*）
let masteryMap = {};
let allQuestions = [];
let serverStats = null;
const state = {
  questions: [],
  filters: { category: "", mastery: "", keyword: "" },
};

function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "q_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function $(sel) { return document.querySelector(sel); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function splitOptions(text) {
  if (!text) return [];
  if (text.indexOf("\n") >= 0) return text.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  return text.split(/(?=[A-E]\.)/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function loadMastery() {
  try {
    const raw = localStorage.getItem(MASTERY_KEY);
    const data = raw ? JSON.parse(raw) : {};
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch (e) {
    return {};
  }
}

function saveMastery(m) {
  try {
    localStorage.setItem(MASTERY_KEY, JSON.stringify(m));
  } catch (e) {
    // localStorage 不可用时静默降级，仅本次会话有效
  }
}

function getMastery(id) {
  return masteryMap[id] || DEFAULT_MASTERY;
}

function calcStats(questions) {
  const categories = {}, reasons = {}, mastery = { "未掌握": 0, "已掌握": 0, "需复习": 0 };
  questions.forEach(function (q) {
    const c = q.category || "未分类";
    const r = q.error_reason || "未填写";
    categories[c] = (categories[c] || 0) + 1;
    reasons[r] = (reasons[r] || 0) + 1;
    const m = getMastery(q.id);
    if (Object.prototype.hasOwnProperty.call(mastery, m)) mastery[m] += 1;
    else mastery[DEFAULT_MASTERY] += 1;
  });
  return { total: questions.length, categories: categories, reasons: reasons, mastery: mastery };
}

function shade(hex, amt) {
  var c = hex.replace("#", "");
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  var num = parseInt(c, 16);
  var r = Math.max(0, Math.min(255, (num >> 16) + amt));
  var g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amt));
  var b = Math.max(0, Math.min(255, (num & 0xff) + amt));
  return "rgb(" + r + "," + g + "," + b + ")";
}

function renderPieChart(data) {
  if (!data || Object.keys(data).length === 0) return '<div class="empty">暂无数据</div>';
  const entries = Object.entries(data).sort(function (a, b) { return b[1] - a[1]; }).filter(function (e) { return e[1] > 0; });
  if (entries.length === 0) return '<div class="empty">暂无数据</div>';
  const colors = ["#3b6ef5", "#18a058", "#d98a00", "#e5484d", "#8b5cf6", "#0ea5e9", "#f59e0b", "#64748b"];
  const total = entries.reduce(function (s, e) { return s + e[1]; }, 0);
  const cx = 130, cy = 120, rx = 105, ry = 62, depth = 26;
  const activeOf = function (cat) { return state.filters.category === cat ? 1 : 0.35; };
  let paths = "";
  if (entries.length === 1) {
    const cat0 = entries[0][0];
    const col0 = colors[0];
    const a0 = activeOf(cat0);
    const left = cx - rx, right = cx + rx;
    const side = 'M ' + left + ' ' + cy +
      ' A ' + rx + ' ' + ry + ' 0 0 1 ' + right + ' ' + cy +
      ' L ' + right + ' ' + (cy + depth) +
      ' A ' + rx + ' ' + ry + ' 0 0 0 ' + left + ' ' + (cy + depth) + ' Z';
    const top = 'M ' + left + ' ' + cy +
      ' A ' + rx + ' ' + ry + ' 0 1 1 ' + right + ' ' + cy +
      ' A ' + rx + ' ' + ry + ' 0 1 1 ' + left + ' ' + cy + ' Z';
    paths += '<path d="' + side + '" fill="' + shade(col0, -55) + '" data-category="' + esc(cat0) + '" opacity="' + a0 + '"></path>';
    paths += '<path d="' + top + '" fill="' + col0 + '" stroke="#fff" stroke-width="1.5" data-category="' + esc(cat0) + '" opacity="' + a0 + '"></path>';
  } else {
    const slices = [];
    let angle = -90;
    entries.forEach(function (e, i) {
      const pct = (e[1] / total) * 360;
      const a1 = angle;
      const a2 = angle + pct;
      const mid = (a1 + a2) / 2;
      slices.push({ e: e, i: i, a1: a1, a2: a2, mid: mid, sin: Math.sin(mid * Math.PI / 180) });
      angle = a2;
    });
    slices.sort(function (a, b) { return a.sin - b.sin; });
    slices.forEach(function (s) {
      const e = s.e, i = s.i;
      const col = colors[i % colors.length];
      const a = activeOf(e[0]);
      const largeArc = (s.a2 - s.a1) > 180 ? 1 : 0;
      const x1 = cx + rx * Math.cos(s.a1 * Math.PI / 180);
      const y1 = cy + ry * Math.sin(s.a1 * Math.PI / 180);
      const x2 = cx + rx * Math.cos(s.a2 * Math.PI / 180);
      const y2 = cy + ry * Math.sin(s.a2 * Math.PI / 180);
      const side = 'M ' + x1.toFixed(3) + ' ' + y1.toFixed(3) +
        ' L ' + x1.toFixed(3) + ' ' + (y1 + depth).toFixed(3) +
        ' L ' + x2.toFixed(3) + ' ' + (y2 + depth).toFixed(3) +
        ' L ' + x2.toFixed(3) + ' ' + y2.toFixed(3) + ' Z';
      const top = 'M ' + cx + ' ' + cy +
        ' L ' + x1.toFixed(3) + ' ' + y1.toFixed(3) +
        ' A ' + rx + ' ' + ry + ' 0 ' + largeArc + ' 1 ' + x2.toFixed(3) + ' ' + y2.toFixed(3) + ' Z';
      paths += '<path d="' + side + '" fill="' + shade(col, -55) + '" data-category="' + esc(e[0]) + '" opacity="' + a + '"></path>';
      paths += '<path d="' + top + '" fill="' + col + '" stroke="#fff" stroke-width="1.5" data-category="' + esc(e[0]) + '" opacity="' + a + '"></path>';
    });
  }
  const legend = entries.map(function (e, i) {
    const pct = total > 0 ? ((e[1] / total) * 100).toFixed(1) : "0.0";
    const activeCls = state.filters.category === e[0] ? " active" : "";
    return '<div class="pie-legend-item' + activeCls + '" data-category="' + esc(e[0]) + '">' +
      '<span class="pie-legend-dot" style="background:' + colors[i % colors.length] + '"></span>' +
      '<span class="pie-legend-name" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span>' +
      '<span class="pie-legend-val">' + e[1] + ' 题 · ' + pct + '%</span>' +
      '</div>';
  }).join("");
  return '<div class="pie-wrap">' +
    '<svg viewBox="0 0 260 240" class="pie-svg" role="img" aria-label="板块错题数饼图">' + paths + '</svg>' +
    '<div class="pie-legend">' + legend + '</div>' +
    '</div>';
}

function matchesKeyword(q, kw) {
  if (!kw) return true;
  const hay = [q.question, q.options, q.answer, q.analysis].map(function (s) {
    return s == null ? "" : String(s);
  }).join("\n");
  return hay.indexOf(kw) >= 0;
}

function applyFilters() {
  const f = state.filters;
  const kw = f.keyword;
  state.questions = allQuestions.filter(function (q) {
    if (f.category && q.category !== f.category) return false;
    if (f.mastery && q.mastery !== f.mastery) return false;
    if (kw && !matchesKeyword(q, kw)) return false;
    return true;
  });
  renderList();
}

function masteryClass(m) {
  if (m === "已掌握") return "ok";
  if (m === "需复习") return "review";

function renderCard(q, idx) {
  const mClass = masteryClass(q.mastery);
  const opts = splitOptions(q.options);
  const optsHtml = opts.length
    ? '<div class="q-options">' + opts.map(function (o) { return '<div class="q-option">' + esc(o) + '</div>'; }).join("") + '</div>'
    : "";
  const answer = (q.answer || "").trim();
  const reason = (q.error_reason || "").trim();
  const analysis = (q.analysis || "").trim();
  const rows = [];
  rows.push('<div class="row"><span class="k">正确答案：</span><span class="ans">' + (answer ? esc(answer) : "未记录") + '</span></div>');
  if (reason) rows.push('<div class="row"><span class="k">错误原因：</span><span class="reason">' + esc(reason) + '</span></div>');
  if (analysis) rows.push('<div class="row"><span class="k">解析：</span><span class="analysis">' + esc(analysis) + '</span></div>');

  const masteryBtns = MASTERY_OPTIONS.map(function (m) {
    const cls = masteryClass(m);
    const active = q.mastery === m ? "active" : "";
    return '<button class="mastery-btn ' + cls + ' ' + active + '" data-id="' + esc(q.id) + '" data-mastery="' + m + '">' + m + '</button>';
  }).join("");

  return '<div class="question-card" data-id="' + esc(q.id) + '">' +
    '<div class="q-head">' +
      '<span class="q-no">第 ' + (idx + 1) + ' 题</span>' +
      '<button type="button" class="tag tag-cat tag-cat-edit" data-id="' + esc(q.id) + '" data-category="' + esc(q.category || "未分类") + '" title="点击编辑板块">' + esc(q.category || "未分类") + '</button>' +
    '</div>' +
    '<div class="q-text">' + esc(q.question) + '</div>' +
    optsHtml +
    '<div class="q-foot">' +
      '<div class="mastery-group">' + masteryBtns + '</div>' +
      '<button class="btn btn-outline show-answer-btn">显示答案</button>' +
    '</div>' +
    '<div class="answer-panel">' + rows.join("") + '</div>' +
  '</div>';
}

function compressImage(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      try {
        const MAX = 2000;
        let w = img.naturalWidth, h = img.naturalHeight;
        const longest = Math.max(w, h);
        if (longest > MAX) {
          const scale = MAX / longest;
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const MAX_BYTES = 5 * 1024 * 1024;
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        while (dataUrl.length > (MAX_BYTES * 4) / 3 && quality > 0.4) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(dataUrl);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("图片加载失败"));
    };
    img.src = url;
  });
}

const ZHIPU_PROMPT = '请识别图片中的错题内容，严格输出 JSON（不要输出 markdown 代码块标记），格式如下：{"question":"题干全文","options":"A. 内容\\nB. 内容\\nC. 内容\\nD. 内容","answer":"正确答案字母，无则空","analysis":"解析，无则空","category":"所属板块，从【言语理解与表达、常识判断、判断推理、数量关系、资料分析、政治理论】中判断，无法判断则空"}。识别规则（务必严格遵守）：1. question 字段只包含题目正文（含问句），严禁混入任何选项内容；2. options 字段每行一个选项，必须以 A./B./C./D. 等字母加点开头，严禁把题干内容当作选项；若某选项跨行则合并到同一行；若图片中题目没有选项（如填空/简答），options 输出空字符串；3. 题干与选项必须严格分离，题干中的文字（包括带字母编号的题干）一律归入 question，只有真正的选项才归入 options；4. 特殊题型处理：语句排序题中，题干为 ① ② ③ 等圆圈数字编号的多句话，全部编号句子及排序要求（如"对上述语句排序，最连贯的一项是"）归入 question，选项为 A./B./C./D. 加数字排列序列（如 A. ④②③①⑦⑤⑥），每行一个选项归入 options；若题干中某行以 A./B./C./D. 等字母加点开头且其后为简短内容，则该行属于选项而非题干；若图片中题干与选项之间有明显分隔（横线/空行），以分隔为界严格划分。';

function zhipuOCR(dataUrl) {
  return fetch("https://open.bigmodel.cn/api/paas/v4/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + ZHIPU_API_KEY,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      model: "glm-4v-flash",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: ZHIPU_PROMPT },
          { type: "image_url", image_url: { url: dataUrl } },
        ],
      }],
    }),
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (data) {
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!content) throw new Error("无返回内容");
    let text = String(content).trim();
    text = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    const obj = JSON.parse(text);
    return {
      question: obj.question || "",
      options: obj.options || "",
      answer: obj.answer || "",
      analysis: obj.analysis || "",
      category: obj.category || "",
    };
  });
}

function normalizeParsed(parsed) {
  if (!parsed) return parsed;
  var qLines = String(parsed.question || "").split("\n");
  var optLines = String(parsed.options || "").split("\n");
  var moved = [], kept = [];
  qLines.forEach(function (line) {
    if (/^[A-E]\s*[.、．)）]/.test(line)) moved.push(line);
    else kept.push(line);
  });
  optLines.forEach(function (line) {
    if (line.trim()) moved.push(line);
  });
  var seen = {}, merged = [];
  moved.forEach(function (line) {
    var m = line.match(/^([A-E])\s*[.、．)）]/);
    if (m) {
      var letter = m[1].toUpperCase();
      if (seen[letter]) return;
      seen[letter] = true;
    }
    merged.push(line);
  });
  var newQuestion = kept.join("\n").trim();
  if (newQuestion) parsed.question = newQuestion;
  parsed.options = merged.join("\n");
  return parsed;
}

function handleFile(file) {
  if (!file) return;
  $("#uploadStatus").textContent = "正在压缩图片…";
  compressImage(file).then(function (dataUrl) {
    $("#uploadStatus").textContent = "正在 AI 识别（智谱 GLM-4V-Flash）…";
    return zhipuOCR(dataUrl);
  }).then(function (parsed) {
    if (!parsed.question) throw new Error("AI 未识别出题干");
    parsed = normalizeParsed(parsed);
    $("#fQuestion").value = parsed.question;
    $("#fOptions").value = parsed.options;
    $("#fAnswer").value = parsed.answer;
    $("#fAnalysis").value = parsed.analysis;
    if (parsed.category) {
      const catSel = $("#fCategoryNew");
      const matched = Array.prototype.some.call(catSel.options, function (o) { return o.value === parsed.category; });
      if (matched) catSel.value = parsed.category;
    }
    $("#uploadStatus").textContent = "AI 识别完成，请核对";
  }).catch(function (e) {
    $("#uploadStatus").textContent = "AI 识别失败：" + (e && e.message ? e.message : e) + "，请检查网络后重试";
  });
}

  if (fileInput.files[0]) { handleFile(fileInput.files[0]); fileInput.value = ""; }
});
$("#btnUploadSave").addEventListener("click", saveNewQuestion);
uploadModal.addEventListener("click", function (e) { if (e.target === uploadModal) closeUploadModal(); });

// 板块编辑
let editingCategoryId = null;

function openCategoryEdit(qid, current) {
  editingCategoryId = qid;
  $("#fCategoryEdit").value = current || "";
  const catSet = {};
  allQuestions.forEach(function (q) { if (q.category) catSet[q.category] = 1; });
  const chips = Object.keys(catSet).map(function (c) {
    return '<button type="button" class="cat-chip' + (c === current ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
  }).join("");
  $("#categoryQuickList").innerHTML = chips || '<span class="upload-hint">暂无已有板块，可直接输入新板块名</span>';
  $("#categoryModal").style.display = "flex";
}

function closeCategoryEdit() {
  $("#categoryModal").style.display = "none";
  editingCategoryId = null;
}

function saveCategoryEdit() {
  const qid = editingCategoryId;
  const newCat = $("#fCategoryEdit").value.trim();
  if (!qid) return;
  if (!newCat) { alert("板块名不能为空"); return; }
  const saveBtn = $("#btnCategorySave");
  saveBtn.disabled = true;
  supabaseClient.from("questions").update({ category: newCat }).eq("id", qid).then(function (res) {
    if (res.error) {
      alert("板块保存失败：" + res.error.message);
    } else {
      allQuestions.forEach(function (q) { if (q.id === qid) q.category = newCat; });
      closeCategoryEdit();
      populateFilters();
      applyFilters();
    }
  }).catch(function (e) {
    alert("板块保存请求失败：" + e);
  }).finally(function () {
    saveBtn.disabled = false;
  });
}

$("#btnCategoryClose").addEventListener("click", closeCategoryEdit);
$("#btnCategoryCancel").addEventListener("click", closeCategoryEdit);
$("#btnCategorySave").addEventListener("click", saveCategoryEdit);
$("#categoryQuickList").addEventListener("click", function (e) {
  const chip = e.target.closest(".cat-chip");
  if (chip) $("#fCategoryEdit").value = chip.dataset.cat;
});
$("#categoryModal").addEventListener("click", function (e) { if (e.target === $("#categoryModal")) closeCategoryEdit(); });

</script>
</body>
