}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 90; pointer-events: none;
  box-shadow: inset 0 0 140px rgba(107,79,46,.22);
}
header {
  background: #F5E6C8;
  color: #1A1A1A;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(120,90,40,.12);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(170,135,70,.25);
}
header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; color: #4A3620; }
header .sub { font-size: 12px; color: #7A6B4F; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 6px; padding: 9px 16px;
  font-size: 14px; cursor: pointer; transition: all .2s ease;
  font-family: inherit;
}
.btn-primary {
  background: var(--primary); color: #fff;
  box-shadow: 0 2px 6px rgba(107,79,46,.22);
}
.btn-primary:hover { filter: brightness(1.12); box-shadow: 0 4px 10px rgba(107,79,46,.28); }
.btn-primary:active { transform: translateY(0); filter: brightness(.95); }
.btn-ghost { background: #FBF6EA; color: var(--primary); border: 1px solid #C9B896; }
.btn-ghost:hover { background: #FBF2DF; transform: translateY(-1px); }
.btn-outline { background: #FBF6EA; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 6px rgba(107,79,46,.10); transform: translateY(-1px); }
.btn-danger { background: #FBF6EA; color: var(--red); border: 1px solid #E3B8A6; box-shadow: var(--shadow-sm); }
.btn-danger:hover { background: #A34A26; color: #FFF9EC; border-color: #A34A26; box-shadow: 0 4px 12px rgba(163,74,38,.24); transform: translateY(-1px); }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  position: relative; overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.stat-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--bar, var(--primary));
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card .num {
  font-size: 28px; font-weight: 800; letter-spacing: .5px; color: var(--bar, var(--primary));
}
.stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat-card.total { --bar: var(--primary); }
.stat-card.weak { --bar: var(--red); }
.stat-card.ok { --bar: var(--green); }
.stat-card.review { --bar: var(--amber); }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.chart-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  transition: transform .2s ease, box-shadow .2s ease;
}
.chart-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.bar-row .name {
  flex: 0 0 150px; text-align: right; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bar-track { flex: 1; background: #E4D9C0; border-radius: 6px; height: 22px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width .3s; display: flex; align-items: center; }
.bar-row .cnt { flex: 0 0 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-fill span { color: #FFF9EC; font-size: 11px; padding: 0 8px; font-weight: 600; }
.pie-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.pie-svg { width: 240px; height: 222px; flex: 0 0 auto; }
.pie-svg path { cursor: pointer; transition: opacity .2s ease; }
.pie-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
.pie-legend-item {
  display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
  border-radius: 10px; padding: 5px 8px; transition: all .18s ease;
}
.pie-legend-item:hover { background: #F3EAD6; }
.pie-legend-item.active { background: var(--primary-soft); box-shadow: inset 0 0 0 1px rgba(107,79,46,.18); }
.pie-legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; box-shadow: none; }
.pie-legend-name { color: var(--text); flex: 0 0 auto; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pie-legend-val { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.type-vbars { display: flex; align-items: flex-end; gap: 12px; padding: 6px 4px 0; min-height: 168px; }
.type-vbar { flex: 1; display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 0; transition: transform .18s ease; }
.type-vbar:hover { transform: translateY(-3px); }
.type-vbar .vbar-val { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
.type-vbar .vbar-track { width: 100%; max-width: 46px; height: 104px; background: #E8DEC6; border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
.type-vbar .vbar-fill { width: 100%; border-radius: 8px; transition: height .45s ease, filter .18s ease; }
.type-vbar:hover .vbar-fill { filter: brightness(1.08); }
.type-vbar .vbar-name { font-size: 12px; color: var(--text); margin-top: 7px; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.type-vbar.active .vbar-track { background: #E2D5B6; }
.type-vbar.active .vbar-fill { box-shadow: 0 0 0 2px var(--primary-soft), 0 0 0 3px rgba(107,79,46,.22); }
.type-vbar.active .vbar-name { color: var(--primary); font-weight: 600; }

.filter-bar {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 22px;
  transition: box-shadow .2s ease;
}
.filter-bar:hover { box-shadow: var(--shadow-md); }

    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = function () { resolve(window.html2canvas); };
    s.onerror = function () { _h2cPromise = null; reject(new Error("截图组件加载失败，请检查网络后重试")); };
    document.head.appendChild(s);
  });
  return _h2cPromise;
}

let isLocal = false;  // 本地后端环境（可访问 /api/*）
let masteryMap = {};
let allQuestions = [];
let serverStats = null;
const state = {
  questions: [],
  filters: { category: "", mastery: "", keyword: "", type: "" },
};

function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "q_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function $(sel) { return document.querySelector(sel); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function splitOptions(text) {
  if (!text) return [];
  if (text.indexOf("\n") >= 0) return text.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  return text.split(/(?=[A-E]\.)/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function splitTrailingQuestion(s) {
  const re = /[。；;\n]/g;
  let m, cut = -1;
  while ((m = re.exec(s)) !== null) cut = m.index;
  const tail = cut < 0 ? s.trim() : s.slice(cut + 1).trim();
  if (tail && /[：:]$/.test(tail)) {
    const head = cut < 0 ? "" : s.slice(0, cut + 1).trim();
    return [head, tail];
  }
  return [s.trim(), ""];
}

function joinQuestionLines(parts) {
  const out = [];
  parts.forEach(function (s) {
    if (!s) return;
    out.push(s.split("\n").map(function (ln) { return esc(ln); }).join("<br>"));
  });
  return out.join("<br>");
}

function formatQuestionText(q) {
  const t = String(q.question == null ? "" : q.question).replace(/\r/g, "");
  if (!t) return "";
  if (t.indexOf("data:image") === 0) {
    return '<img class="q-image" src="' + t + '" alt="题目图片">';
  }
  const isSort = /[①②③④⑤⑥⑦⑧⑨⑩]/.test(t) || /排序|语序/.test(t);
  const isBlank = /[＿_]/.test(t) && /填|横线|最恰当/.test(t);
  if (isSort) {
    const parts = t.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(function (s) { return s.trim(); }).filter(Boolean);
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) {
        const sp = splitTrailingQuestion(parts[i]);
        if (sp[1]) { out.push(sp[0], sp[1]); } else { out.push(sp[0]); }
      } else {
        out.push(parts[i]);
      }
    }
    return joinQuestionLines(out);
  }
  const sp = splitTrailingQuestion(t);
  return joinQuestionLines(sp[1] ? [sp[0], sp[1]] : [sp[0]]);
}


function loadMastery() {
  try {
    const raw = localStorage.getItem(MASTERY_KEY);
    const data = raw ? JSON.parse(raw) : {};
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch (e) {
    return {};
  }
}

function saveMastery(m) {
  try {
    localStorage.setItem(MASTERY_KEY, JSON.stringify(m));
  } catch (e) {
    // localStorage 不可用时静默降级，仅本次会话有效
  }
}

function getMastery(id) {
  return masteryMap[id] || DEFAULT_MASTERY;
}

function calcStats(questions) {
  const categories = {}, types = {}, reasons = {}, mastery = { "未掌握": 0, "已掌握": 0, "需复习": 0 };
  questions.forEach(function (q) {
    const c = q.category || "未分类";
    const t = q.type || "未分类";
    const r = q.error_reason || "未填写";
    categories[c] = (categories[c] || 0) + 1;
    types[t] = (types[t] || 0) + 1;
    reasons[r] = (reasons[r] || 0) + 1;
    const m = getMastery(q.id);
    if (Object.prototype.hasOwnProperty.call(mastery, m)) mastery[m] += 1;
    else mastery[DEFAULT_MASTERY] += 1;
  });
  return { total: questions.length, categories: categories, types: types, reasons: reasons, mastery: mastery };
}

function shade(hex, amt) {
  var c = hex.replace("#", "");
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  var num = parseInt(c, 16);
  var r = Math.max(0, Math.min(255, (num >> 16) + amt));
  var g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amt));
  var b = Math.max(0, Math.min(255, (num & 0xff) + amt));
  return "rgb(" + r + "," + g + "," + b + ")";
}

function renderPieChart(data) {
  if (!data || Object.keys(data).length === 0) return '<div class="empty">暂无数据</div>';
  const entries = Object.entries(data).sort(function (a, b) { return b[1] - a[1]; }).filter(function (e) { return e[1] > 0; });
  if (entries.length === 0) return '<div class="empty">暂无数据</div>';
  const colors = ["#6B4F2E", "#A97C50", "#C08A3E", "#8A6A42", "#7D8F69", "#B4552D", "#9C8B6F", "#5A6B5A"];
  const total = entries.reduce(function (s, e) { return s + e[1]; }, 0);
  const cx = 130, cy = 120, r = 100;
  const activeOf = function (cat) { return state.filters.category === cat ? 1 : 0.35; };
  let paths = "";
  if (entries.length === 1) {
    const cat0 = entries[0][0];
    const col0 = colors[0];
    paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col0 + '" data-category="' + esc(cat0) + '" opacity="' + activeOf(cat0) + '"></circle>';
  } else {
    let angle = -90;
    entries.forEach(function (e, i) {
      const col = colors[i % colors.length];
      const a = activeOf(e[0]);
      const pct = (e[1] / total) * 360;
      const a1 = angle;
      const a2 = angle + pct;
      const largeArc = (a2 - a1) > 180 ? 1 : 0;
      const x1 = cx + r * Math.cos(a1 * Math.PI / 180);
      const y1 = cy + r * Math.sin(a1 * Math.PI / 180);
      const x2 = cx + r * Math.cos(a2 * Math.PI / 180);
      const y2 = cy + r * Math.sin(a2 * Math.PI / 180);
      paths += '<path d="M ' + cx + ' ' + cy + ' L ' + x1.toFixed(3) + ' ' + y1.toFixed(3) +
        ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2.toFixed(3) + ' ' + y2.toFixed(3) +
        ' Z" fill="' + col + '" stroke="#FAF3E3" stroke-width="1.5" data-category="' + esc(e[0]) + '" opacity="' + a + '"></path>';
      angle = a2;
    });
  }
  const legend = entries.map(function (e, i) {
    const pct = total > 0 ? ((e[1] / total) * 100).toFixed(1) : "0.0";
    const activeCls = state.filters.category === e[0] ? " active" : "";
    return '<div class="pie-legend-item' + activeCls + '" data-category="' + esc(e[0]) + '">' +
      '<span class="pie-legend-dot" style="background:' + colors[i % colors.length] + '"></span>' +
      '<span class="pie-legend-name" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span>' +
      '<span class="pie-legend-val">' + e[1] + ' 题 · ' + pct + '%</span>' +
      '</div>';
  }).join("");
  return '<div class="pie-wrap">' +
    '<svg viewBox="0 0 260 240" class="pie-svg" role="img" aria-label="板块错题数饼图">' + paths + '</svg>' +
    '<div class="pie-legend">' + legend + '</div>' +
    '</div>';
}

function renderStats() {
  const s = serverStats || calcStats(allQuestions);
  $("#stTotal").textContent = s.total;
  $("#stWeak").textContent = s.mastery["未掌握"] || 0;
  $("#stOk").textContent = s.mastery["已掌握"] || 0;
  $("#stReview").textContent = s.mastery["需复习"] || 0;
  $("#chartCategory").innerHTML = renderPieChart(s.categories);
  $("#chartCategory").onclick = function (e) {
    const el = e.target.closest("[data-category]");
    if (el) filterByCategory(el.dataset.category);
  };
  const typeEl = $("#chartType");
  if (typeEl) {
    typeEl.innerHTML = renderTypeStats(s.types);
    typeEl.onclick = function (e) {
      const el = e.target.closest("[data-type]");
      if (el) filterByType(el.dataset.type);
    };
  }
}

function filterByCategory(cat) {
  if (state.filters.category === cat) {
    state.filters.category = "";
  } else {
    state.filters.category = cat;
  }
  const catSel = $("#fCategory");
  if (catSel) catSel.value = state.filters.category;
  renderStats();
  applyFilters();
  const list = $("#list");
  if (list) list.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderTypeStats(types) {
  let entries = Object.keys(types || {}).map(function (k) { return [k, types[k]]; });
  const order = ["片段阅读", "逻辑填空", "语句排序"];
  entries.sort(function (a, b) {
    const ia = order.indexOf(a[0]);
    const ib = order.indexOf(b[0]);
    if (ia < 0 && ib < 0) return b[1] - a[1];
    if (ia < 0) return 1;
    if (ib < 0) return -1;
    return ia - ib;
  });
  entries = entries.filter(function (e) { return e[1] > 0; });
  if (entries.length === 0) return '<div class="empty">暂无数据</div>';
  const max = Math.max.apply(null, entries.map(function (e) { return e[1]; }));
  const colors = ["#6B4F2E", "#A97C50", "#C08A3E", "#7D8F69", "#B4552D"];
  const items = entries.map(function (e, i) {
    const h = max > 0 ? Math.max(4, Math.round((e[1] / max) * 100)) : 0;
    const activeCls = state.filters.type === e[0] ? " active" : "";
    return '<div class="type-vbar' + activeCls + '" data-type="' + esc(e[0]) + '" title="' + esc(e[0]) + ' ' + e[1] + ' 题">' +
      '<div class="vbar-val">' + e[1] + '</div>' +
      '<div class="vbar-track"><div class="vbar-fill" style="height:' + h + '%;background:' + colors[i % colors.length] + '"></div></div>' +
      '<div class="vbar-name">' + esc(e[0]) + '</div>' +
      '</div>';
  }).join("");
  return '<div class="type-vbars">' + items + '</div>';
}

function filterByType(type) {
  if (state.filters.type === type) {
    state.filters.type = "";
  } else {
    state.filters.type = type;
  }
  const typeSel = $("#fType");
  if (typeSel) typeSel.value = state.filters.type;
  renderStats();
  applyFilters();
  const list = $("#list");
  if (list) list.scrollIntoView({ behavior: "smooth", block: "start" });
}

function populateFilters() {
  const catSel = $("#fCategory");
  const curCat = catSel.value;
  const catSet = {};
  allQuestions.forEach(function (q) {
    catSet[q.category || "未分类"] = 1;
  });
  catSel.innerHTML = '<option value="">全部板块</option>' +
    Object.keys(catSet).map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("");
  catSel.value = curCat;

  const typeSel = $("#fType");
  if (!typeSel) return;
  const curType = typeSel.value;
  const typeSet = {};
  allQuestions.forEach(function (q) { if (q.type) typeSet[q.type] = 1; });
  const fixedTypes = ["片段阅读", "逻辑填空", "语句排序"];
  fixedTypes.forEach(function (t) { typeSet[t] = 1; });
  const typeOrder = fixedTypes.filter(function (t) { return typeSet[t]; })
    .concat(Object.keys(typeSet).filter(function (t) { return fixedTypes.indexOf(t) < 0; }));
  typeSel.innerHTML = '<option value="">全部题型</option>' +
    typeOrder.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join("");
  typeSel.value = curType;
}

function matchesKeyword(q, kw) {
  if (!kw) return true;
  const hay = [q.question, q.options, q.answer, q.analysis].map(function (s) {
    return s == null ? "" : String(s);
  }).join("\n");
  return hay.indexOf(kw) >= 0;
}

function clearFilters() {
  state.filters.category = "";
  state.filters.type = "";
  state.filters.mastery = "";
  state.filters.keyword = "";
  const kw = $("#fKeyword"); if (kw) kw.value = "";
  const cat = $("#fCategory"); if (cat) cat.value = "";
  const tp = $("#fType"); if (tp) tp.value = "";
  const ms = $("#fMastery"); if (ms) ms.value = "";
  renderStats();
  applyFilters();
}

function applyFilters() {
  const f = state.filters;
  const kw = f.keyword;
  state.questions = allQuestions.filter(function (q) {
    if (f.category && (q.category || "未分类") !== f.category) return false;
    if (f.type && (q.type || "") !== f.type) return false;
    if (f.mastery && q.mastery !== f.mastery) return false;
    if (kw && !matchesKeyword(q, kw)) return false;
    return true;
  });
  renderList();
}

function masteryClass(m) {
  if (m === "已掌握") return "ok";
  if (m === "需复习") return "review";
  return "weak";
}

function renderList() {

  $("#filterCount").textContent = "共 " + state.questions.length + " 道";

function setMastery(id, mastery) {
  masteryMap[id] = mastery;
  allQuestions.forEach(function (q) { if (q.id === id) q.mastery = mastery; });
  serverStats = null;
  renderStats();
  applyFilters();
  supabaseClient.from("mastery").upsert({ id: id, mastery: mastery, updated_at: new Date().toISOString() })
    .then(function (res) {
      if (res.error) alert("掌握状态保存失败：" + res.error.message);
    });
}

function setAnswerMastery(id, mastery, refreshList) {
  masteryMap[id] = mastery;
  allQuestions.forEach(function (q) { if (q.id === id) q.mastery = mastery; });
  serverStats = null;
  renderStats();
  if (refreshList) {
    applyFilters();
  } else {
    const card = document.querySelector('.question-card[data-id="' + id + '"]');
    if (card) {
      card.querySelectorAll(".mastery-btn").forEach(function (btn) {
        btn.classList.toggle("active", mastery === "未掌握");
      });
    }
  }
  supabaseClient.from("mastery").upsert({ id: id, mastery: mastery, updated_at: new Date().toISOString() })
    .then(function (res) {
      if (res.error) alert("掌握状态保存失败：" + res.error.message);
    });
}

function extractAnswerLetters(answer) {
  if (!answer) return [];
  const m = String(answer).match(/[A-Ea-e]/g);
  if (!m) return [];
  const seen = {}, letters = [];
  m.forEach(function (ch) {
    const up = ch.toUpperCase();
    if (!seen[up]) { seen[up] = 1; letters.push(up); }
  });
  return letters;
}

function checkOptionAnswer(optEl) {
  const id = optEl.dataset.id;
  const optLetter = (optEl.dataset.opt || "").toUpperCase();
  const card = optEl.closest(".question-card");
  const q = allQuestions.find(function (item) { return item.id === id; });
  if (!q || !card) return;

  // 再次点击已作答的选项：取消本次作答高亮
  if (optEl.classList.contains("selected") || optEl.classList.contains("correct") || optEl.classList.contains("wrong")) {
    card.querySelectorAll(".q-option").forEach(function (el) {
      el.classList.remove("selected", "correct", "wrong");
    });
    return;
  }

  const correctLetters = extractAnswerLetters(q.answer);
  if (correctLetters.length === 0) {
    alert("该题未设置答案，请先编辑填写");
    return;
  }

  // 重新选择：清除本卡片的旧作答状态
  card.querySelectorAll(".q-option").forEach(function (el) {
    el.classList.remove("selected", "correct", "wrong");
  });
  optEl.classList.add("selected");

  if (correctLetters.indexOf(optLetter) >= 0) {
    optEl.classList.add("correct");
    // 选对：掌握状态归为已掌握
    const curM = q.mastery || "未掌握";
    if (curM !== "已掌握") {
      setAnswerMastery(id, "已掌握", !!state.filters.mastery);
    }
  } else {
    optEl.classList.add("wrong");
    card.querySelectorAll(".q-option").forEach(function (el) {
      const l = (el.dataset.opt || "").toUpperCase();
      if (correctLetters.indexOf(l) >= 0) el.classList.add("correct");
    });
    // 选错：当前筛选为"未掌握"时归入需复习，否则归入未掌握
    const curM2 = q.mastery || "未掌握";
    const targetM = state.filters.mastery === "未掌握" ? "需复习" : "未掌握";
    if (curM2 !== targetM) {
      setAnswerMastery(id, targetM, !!state.filters.mastery);
    }
  }
}

function scopeLabel() {
  const f = state.filters;
  const kw = f.keyword ? ("关键字:" + f.keyword) : "";
  const parts = [f.category, f.type, f.mastery, kw].filter(Boolean);
  return parts.join(" / ") || "全部";
}

function buildPrintHtml(qs) {
  const date = new Date().toISOString().slice(0, 10);

  parts.push('<div class="print-title">WaytoGWY 错题复盘导出</div>');
  parts.push('<div class="print-subtitle">共 ' + qs.length + ' 道错题 | ' + scopeLabel() + ' | ' + date + '</div>');

}

function exportPrint() {
  if (isLocal) {
    // 本地环境：调用后端 /api/export 生成 PDF
    const payload = {
      category: state.filters.category,
      type: state.filters.type,
      mastery: state.filters.mastery,
    };
    fetch("/api/export", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.success && j.url) {

function openDrawMode(btn) {
  finishDrawSession();
  const card = btn.closest(".question-card");
  if (!card) return;
  const img = card.querySelector(".q-draw-img");
  const canvas = card.querySelector(".q-draw-canvas");
  const toolbar = card.querySelector(".q-draw-toolbar");
  const w = card.clientWidth, h = card.clientHeight;
  if (!w || !h) return;
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  let saved = null;
  try { saved = localStorage.getItem("qdraw_" + btn.dataset.id) || null; } catch (err) { saved = null; }
  if (saved) {
    const im = new Image();
    im.onload = function () { ctx.drawImage(im, 0, 0, w, h); };
    im.src = saved;
  }
  drawSession = {
    id: btn.dataset.id, card: card, img: img, canvas: canvas, toolbar: toolbar, ctx: ctx,
    color: "#B4552D", size: 4, erasing: false, drawing: false
  };
  img.style.display = "none";
  canvas.classList.add("active");
  toolbar.classList.add("open");
  setDrawToolbarState();
}

function setDrawToolbarState() {
  if (!drawSession) return;
  const tb = drawSession.toolbar;
  tb.querySelector('[data-action="color-red"]').classList.toggle("active", drawSession.color === "#B4552D");
  tb.querySelector('[data-action="color-black"]').classList.toggle("active", drawSession.color === "#000000");
  tb.querySelector('[data-action="size-thin"]').classList.toggle("active", drawSession.size === 2);
  tb.querySelector('[data-action="size-bold"]').classList.toggle("active", drawSession.size === 4);
  tb.querySelector('[data-action="eraser"]').classList.toggle("active", drawSession.erasing);
}

function finishDrawSession() {
  if (!drawSession) return;
  const s = drawSession;
  try {
    const dataUrl = s.canvas.toDataURL("image/png");
    localStorage.setItem("qdraw_" + s.id, dataUrl);
    s.img.src = dataUrl;
    s.img.style.display = "";
  } catch (err) {
    console.warn("保存圈画失败", err);
  }
  s.canvas.classList.remove("active");
  s.toolbar.classList.remove("open");
  drawSession = null;
}

document.addEventListener("pointerdown", function (e) {
  const cv = e.target.closest(".q-draw-canvas");
  if (!cv || !drawSession || cv !== drawSession.canvas) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  drawSession.drawing = true;
  drawSession.lastX = e.clientX - rect.left;
  drawSession.lastY = e.clientY - rect.top;
  drawSession.ctx.beginPath();
  drawSession.ctx.moveTo(drawSession.lastX, drawSession.lastY);
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});

document.addEventListener("pointermove", function (e) {
  if (!drawSession || !drawSession.drawing) return;
  e.preventDefault();
  const cv = drawSession.canvas;
  const rect = cv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const ctx = drawSession.ctx;
  ctx.globalCompositeOperation = drawSession.erasing ? "destination-out" : "source-over";
  ctx.strokeStyle = drawSession.color;
  ctx.lineWidth = drawSession.size;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineTo(x, y);
  ctx.stroke();
  drawSession.lastX = x;
  drawSession.lastY = y;
});

document.addEventListener("pointerup", function () {
  if (drawSession) drawSession.drawing = false;
});

function compressImage(file) {
  return new Promise(function (resolve, reject) {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function () {
      try {
        const MAX = 2000;
        let w = img.naturalWidth, h = img.naturalHeight;
        const longest = Math.max(w, h);
        if (longest > MAX) {
          const scale = MAX / longest;
          w = Math.max(1, Math.round(w * scale));
          h = Math.max(1, Math.round(h * scale));
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        const MAX_BYTES = 5 * 1024 * 1024;
        let quality = 0.85;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        while (dataUrl.length > (MAX_BYTES * 4) / 3 && quality > 0.4) {
          quality -= 0.1;
          dataUrl = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(dataUrl);
      } catch (e) {
        URL.revokeObjectURL(url);
        reject(e);
      }
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error("图片加载失败"));
    };
    img.src = url;
  });
}

function compressAIImage(file, maxBytes) {
  maxBytes = maxBytes || 2 * 1024 * 1024;
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    fr.onerror = function () { reject(new Error("图片读取失败")); };
    fr.onload = function () {
      const raw = fr.result;
      if (raw.length <= maxBytes) return resolve(raw);
      const img = new Image();
      img.onerror = function () { reject(new Error("图片解析失败")); };
      img.onload = function () {
        const MAX_EDGE = 1280;
        let w = img.width, h = img.height;
        if (Math.max(w, h) > MAX_EDGE) {
          const ratio = MAX_EDGE / Math.max(w, h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let quality = 0.85;
        let out = canvas.toDataURL("image/jpeg", quality);
        while (out.length > maxBytes && quality > 0.4) {
          quality -= 0.15;
          out = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(out);
      };
      img.src = raw;
    };
    fr.readAsDataURL(file);
  });
}

      question: obj.question || "",
      options: obj.options || "",
      answer: obj.answer || "",
      analysis: obj.analysis || "",
      category: obj.category || "",
    };
  });
}

function qwenVLOCR(dataUrl) {
  return fetch("https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + DASHSCOPE_API_KEY,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      model: "qwen-vl-ocr",
      messages: [{
        role: "user",
        content: [
          { type: "text", text: ZHIPU_PROMPT },
          { type: "image_url", image_url: { url: dataUrl } },
        ],
      }],
    }),
  }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }).then(function (data) {
    const content = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!content) throw new Error("无返回内容");
    let text = String(content).trim();
    text = text.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/, "");
    const obj = JSON.parse(text);
    const parsed = {
      question: obj.question || "",
      options: obj.options || "",
      answer: obj.answer || "",
      analysis: obj.analysis || "",
      category: obj.category || "",
    };
    if (!parsed.question) throw new Error("AI 未识别出题干");
    return parsed;
  });
}

function normalizeParsed(parsed) {
  if (!parsed) return parsed;
  var qLines = String(parsed.question || "").split("\n");
  var optLines = String(parsed.options || "").split("\n");
  var moved = [], kept = [];
  qLines.forEach(function (line) {
    if (/^[A-E]\s*[.、．)）]/.test(line)) moved.push(line);
    else kept.push(line);
  });
  optLines.forEach(function (line) {
    if (line.trim()) moved.push(line);
  });
  var seen = {}, merged = [];
  moved.forEach(function (line) {
    var m = line.match(/^([A-E])\s*[.、．)）]/);
    if (m) {
      var letter = m[1].toUpperCase();
      if (seen[letter]) return;
      seen[letter] = true;
    }
    merged.push(line);
  });
  var newQuestion = kept.join("\n").trim();
  if (newQuestion) parsed.question = newQuestion;
  parsed.options = merged.join("\n");
  return parsed;
}

function handleFile(file) {
  if (!file) return;
  $("#uploadStatus").textContent = "正在压缩图片…";
  compressImage(file).then(function (dataUrl) {
    $("#uploadStatus").textContent = "正在 AI 识别（通义千问 qwen-vl-ocr）…";
    return qwenVLOCR(dataUrl).catch(function (e) {
      $("#uploadStatus").textContent = "通义千问识别失败，回退智谱 GLM-4V-Flash…";
      return zhipuOCR(dataUrl);
    });
  }).then(function (parsed) {
    if (!parsed.question) throw new Error("AI 未识别出题干");
    parsed = normalizeParsed(parsed);
    $("#fQuestion").value = parsed.question;
    $("#fOptions").value = parsed.options;
    $("#fAnswer").value = parsed.answer;
    $("#fAnalysis").value = parsed.analysis;
    if (parsed.category) {
      const catSel = $("#fCategoryNew");
      const matched = Array.prototype.some.call(catSel.options, function (o) { return o.value === parsed.category; });
      if (matched) catSel.value = parsed.category;
    }
    $("#uploadStatus").textContent = "AI 识别完成，请核对";
  }).catch(function (e) {
    $("#uploadStatus").textContent = "AI 识别失败：" + (e && e.message ? e.message : e) + "，请检查网络后重试";
  });
}

function saveNewQuestion() {
  const question = $("#fQuestion").value.trim();
  if (!question) {
    alert("题干不能为空");
    return;
  }
  const payload = {
    id: genId(),
    question: question,
    options: $("#fOptions").value.trim(),
    answer: $("#fAnswer").value.trim(),
    category: $("#fCategoryNew").value,
    error_reason: "",
    analysis: $("#fAnalysis").value.trim(),
    created_at: new Date().toISOString(),
  };
  $("#btnUploadSave").disabled = true;
  supabaseClient.from("questions").insert([payload]).then(function (res) {
    if (res.error) {
      alert("保存失败：" + res.error.message);
    } else {
      alert("保存成功");
      closeUploadModal();
      loadData();
    }
  }).catch(function (e) {
    alert("保存请求失败：" + e);
  }).finally(function () {
    $("#btnUploadSave").disabled = false;
  });
}

// 板块编辑
let editingCategoryId = null;

function openCategoryEdit(qid, current) {
  editingCategoryId = qid;
  $("#fCategoryEdit").value = current || "";
  const catSet = {};
  allQuestions.forEach(function (q) { if (q.category) catSet[q.category] = 1; });
  const chips = Object.keys(catSet).map(function (c) {
    return '<button type="button" class="cat-chip' + (c === current ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
  }).join("");
  $("#categoryQuickList").innerHTML = chips || '<span class="upload-hint">暂无已有板块，可直接输入新板块名</span>';
  $("#categoryModal").style.display = "flex";
}

function closeCategoryEdit() {
  $("#categoryModal").style.display = "none";
  editingCategoryId = null;
}

function saveCategoryEdit() {
  const qid = editingCategoryId;
  const newCat = $("#fCategoryEdit").value.trim();
  if (!qid) return;
  if (!newCat) { alert("板块名不能为空"); return; }
  const saveBtn = $("#btnCategorySave");
  saveBtn.disabled = true;
  supabaseClient.from("questions").update({ category: newCat }).eq("id", qid).then(function (res) {
    if (res.error) {
      alert("板块保存失败：" + res.error.message);
    } else {
      allQuestions.forEach(function (q) { if (q.id === qid) q.category = newCat; });
      closeCategoryEdit();
      populateFilters();
      applyFilters();
    }
  }).catch(function (e) {
    alert("板块保存请求失败：" + e);
  }).finally(function () {
    saveBtn.disabled = false;
  });
}

$("#btnCategoryClose").addEventListener("click", closeCategoryEdit);
$("#btnCategoryCancel").addEventListener("click", closeCategoryEdit);
$("#btnCategorySave").addEventListener("click", saveCategoryEdit);
$("#categoryQuickList").addEventListener("click", function (e) {
  const chip = e.target.closest(".cat-chip");
  if (chip) $("#fCategoryEdit").value = chip.dataset.cat;
});
$("#categoryModal").addEventListener("click", function (e) { if (e.target === $("#categoryModal")) closeCategoryEdit(); });

// 编辑题目
let editingQuestionId = null;

function fillEditSelects() {
  const catSel = $("#fEditCategory");
  const catSet = {};
  allQuestions.forEach(function (q) {
    if (q.category) catSet[q.category] = 1;
  });
  catSel.innerHTML = '<option value="">请选择板块</option>' +
    Object.keys(catSet).map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join("");
}

function openEditModal(qid) {
  const q = allQuestions.find(function (item) { return item.id === qid; });
  if (!q) return;
  editingQuestionId = qid;
  fillEditSelects();
  const qText = q.question || "";
  if (String(qText).indexOf("data:image") === 0) {
    $("#fEditQuestion").value = "[图片题] 题干为图片（保存时自动保留原图，此处无需修改）";
  } else {
    $("#fEditQuestion").value = qText;
  }
  $("#fEditOptions").value = q.options || "";
  $("#fEditAnswer").value = q.answer || "";
  $("#fEditAnalysis").value = q.analysis || "";
  const catSel = $("#fEditCategory");
  const matched = Array.prototype.some.call(catSel.options, function (o) { return o.value === (q.category || ""); });
  if (matched) catSel.value = q.category;
  else catSel.value = "";
  $("#editModal").style.display = "flex";
}

function closeEditModal() {
  $("#editModal").style.display = "none";
  editingQuestionId = null;
}

function saveEditQuestion() {
  const qid = editingQuestionId;
  if (!qid) return;
  const editQ = allQuestions.find(function (item) { return item.id === qid; });
  const isImageQ = editQ && String(editQ.question || "").indexOf("data:image") === 0;
  let question = $("#fEditQuestion").value.trim();
  if (isImageQ) {
    question = String(editQ.question || ""); // 图片题保存时保留原图
  } else if (!question) {
    alert("题干不能为空");
    return;
  }
  const payload = {
    question: question,
    options: $("#fEditOptions").value.trim(),
    answer: $("#fEditAnswer").value.trim(),
    category: $("#fEditCategory").value,
    analysis: $("#fEditAnalysis").value.trim(),
  };
  const saveBtn = $("#btnEditSave");
  saveBtn.disabled = true;
  supabaseClient.from("questions").update(payload).eq("id", qid).then(function (res) {
    if (res.error) {
      alert("保存失败：" + res.error.message);
    } else {
      closeEditModal();
      loadData();
    }
  }).catch(function (e) {
    alert("保存请求失败：" + e);
  }).finally(function () {
    saveBtn.disabled = false;
  });
}

$("#btnEditClose").addEventListener("click", closeEditModal);
$("#btnEditCancel").addEventListener("click", closeEditModal);
$("#btnEditSave").addEventListener("click", saveEditQuestion);
$("#editModal").addEventListener("click", function (e) { if (e.target === $("#editModal")) closeEditModal(); });
