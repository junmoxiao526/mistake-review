<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复盘平台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #F5F6F8;
  --bg2: #FAFBFC;
  --card: #FFFFFF;
  --primary: #1D2B4C;
  --primary-2: #2D3D63;
  --primary-deep: #16213A;
  --primary-soft: #EEF1F7;
  --border: #E0E0E0;
  --border-soft: #ECECEC;
  --text: #1A1A1A;
  --muted: #666666;
  --red: #E5484D;
  --green: #18A058;
  --amber: #D98A00;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.05);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08);
  --shadow-lg: 0 6px 16px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06);
  --radius: 8px;
  --radius-sm: 6px;
  --grad-primary: #1D2B4C;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  background: var(--bg);
  background-attachment: fixed;
  color: var(--text);
  line-height: 1.6;
}
header {
  background: var(--primary);
  color: #fff;
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.10);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,.08);
}
header h1 { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
header .sub { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
.header-actions { display: flex; gap: 10px; }
.btn {
  border: none; border-radius: 6px; padding: 9px 16px;
  font-size: 14px; cursor: pointer; transition: all .2s ease;
  font-family: inherit;
}
.btn-primary {
  background: var(--primary); color: #fff;
  box-shadow: 0 2px 6px rgba(29,43,76,.22);
}
.btn-primary:hover { filter: brightness(1.12); box-shadow: 0 4px 10px rgba(29,43,76,.28); }
.btn-primary:active { transform: translateY(0); filter: brightness(.95); }
.btn-ghost { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.14); }
.btn-ghost:hover { background: rgba(255,255,255,.22); transform: translateY(-1px); }
.btn-outline { background: #fff; color: var(--text); border: 1px solid var(--border); box-shadow: none; }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 6px rgba(29,43,76,.10); transform: translateY(-1px); }
.btn-danger { background: #fff; color: #e5484d; border: 1px solid #f3c1c3; box-shadow: var(--shadow-sm); }
.btn-danger:hover { background: #e5484d; color: #fff; border-color: #e5484d; box-shadow: 0 4px 12px rgba(229,72,77,.2); transform: translateY(-1px); }
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  position: relative; overflow: hidden;
  transition: transform .2s ease, box-shadow .2s ease;
}
.stat-card::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: var(--bar, var(--primary));
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-card .num {
  font-size: 28px; font-weight: 800; letter-spacing: .5px; color: var(--bar, var(--primary));
}
.stat-card .label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.stat-card.total { --bar: var(--primary); }
.stat-card.weak { --bar: var(--red); }
.stat-card.ok { --bar: var(--green); }
.stat-card.review { --bar: var(--amber); }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.chart-card {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  transition: transform .2s ease, box-shadow .2s ease;
}
.chart-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { font-size: 15px; margin-bottom: 14px; font-weight: 600; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; font-size: 13px; }
.bar-row .name {
  flex: 0 0 150px; text-align: right; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bar-track { flex: 1; background: #EEEEEE; border-radius: 6px; height: 22px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; transition: width .3s; display: flex; align-items: center; }
.bar-row .cnt { flex: 0 0 34px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar-fill span { color: #fff; font-size: 11px; padding: 0 8px; font-weight: 600; }
.pie-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.pie-svg { width: 240px; height: 222px; flex: 0 0 auto; }
.pie-svg path { cursor: pointer; transition: opacity .2s ease; }
.pie-legend { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 180px; }
.pie-legend-item {
  display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer;
  border-radius: 10px; padding: 5px 8px; transition: all .18s ease;
}
.pie-legend-item:hover { background: #f1f5ff; }
.pie-legend-item.active { background: var(--primary-soft); box-shadow: inset 0 0 0 1px rgba(29,43,76,.18); }
.pie-legend-dot { width: 12px; height: 12px; border-radius: 4px; flex: 0 0 auto; box-shadow: none; }
.pie-legend-name { color: var(--text); flex: 0 0 auto; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.pie-legend-val { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.type-chart { position: relative; padding: 2px 0 0; }
.type-chart svg { display: block; width: 100%; height: auto; }
.type-chart .grid-line { stroke: #E7E9EF; stroke-width: 1; stroke-dasharray: 3 4; }
.type-chart .axis-line { stroke: #C7CBD7; stroke-width: 1.2; }
.type-chart .tick-label { font-size: 11px; fill: #8A90A3; font-family: inherit; }
.type-chart .bar-rect { cursor: pointer; transition: opacity .18s ease; }
.type-chart .bar-rect:hover { opacity: .82; }
.type-chart .bar-rect.active { stroke: #3B6EF5; stroke-width: 2; }
.type-chart .bar-val { font-size: 12.5px; font-weight: 600; fill: var(--text); text-anchor: middle; font-variant-numeric: tabular-nums; }
.type-chart .bar-name { font-size: 11.5px; fill: var(--text); text-anchor: middle; }
.type-chart .bar-name.active { fill: var(--primary); font-weight: 600; }
.type-chart .seg-val { font-size: 11px; font-weight: 600; fill: #fff; text-anchor: middle; font-variant-numeric: tabular-nums; paint-order: stroke; stroke: rgba(0,0,0,.28); stroke-width: 2px; pointer-events: none; }
.type-chart .legend-svg-text { font-size: 11.5px; fill: var(--text); }
.type-chart .legend-svg-dot { opacity: .94; }
.type-chart .type-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; justify-content: center; }
.type-chart .type-legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text); }
.type-chart .type-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: 0 0 auto; }
.type-chart .type-legend-val { color: var(--muted); font-variant-numeric: tabular-nums; }

.filter-bar {
  background: var(--card); border-radius: var(--radius); padding: 16px 18px;
  box-shadow: none; border: 1px solid var(--border);
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 22px;
  transition: box-shadow .2s ease;
}
.filter-bar:hover { box-shadow: var(--shadow-md); }
.filter-item { display: flex; align-items: center; gap: 8px; }
.filter-item label { font-size: 13px; color: var(--muted); white-space: nowrap; }
.filter-item select {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 13px; background: #fff; cursor: pointer; font-family: inherit;
  min-width: 150px; color: var(--text); transition: all .18s ease;
}
.filter-item select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,43,76,.18); }
.filter-item input {
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px;
  font-size: 13px; background: #fff; font-family: inherit;
  min-width: 230px; color: var(--text); transition: all .18s ease;
}
.filter-item input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,43,76,.18); }
.filter-count { margin-left: auto; font-size: 13px; color: var(--muted); }

.question-card {
  position: relative;
  background: var(--card); border-radius: var(--radius); padding: 20px 22px;
  box-shadow: none; border: 1px solid var(--border); margin-bottom: 14px;
  transition: transform .2s ease, box-shadow .2s ease;
}
.question-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.q-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.q-no {
  font-weight: 800; font-size: 15px; color: #fff;
  background: var(--primary); border-radius: 6px; padding: 2px 9px;
  box-shadow: none;
}
.tag {
  font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500;
}
.tag-cat { background: var(--primary-soft); color: var(--primary); }
.tag-cat-edit { cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
.tag-cat-edit:hover { background: #dfe4ee; box-shadow: 0 0 0 1px var(--primary); }
.cat-chip {
  border: 1px solid var(--border); background: #fff; color: var(--text);
  border-radius: 20px; padding: 5px 13px; font-size: 13px; cursor: pointer;
  transition: all .18s ease; font-family: inherit;
}
.cat-chip:hover { border-color: var(--primary); color: var(--primary); box-shadow: 0 2px 8px rgba(29,43,76,.12); }
.cat-chip.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.category-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.q-text { font-size: 15px; font-weight: 500; margin-bottom: 10px; text-align: justify; text-justify: inter-ideograph; }
  .q-text img.q-image { display: block; max-width: 100%; height: auto; border-radius: 10px; margin: 8px 0; }
.q-para { display: block; margin: 6px 0; text-align: justify; text-justify: inter-ideograph; text-indent: 2em; }
/* 材料内嵌图片（资料分析图表渲染） */
.q-figure { margin: 10px 0; text-align: center; }
.q-figure img.q-material-img { max-width: 100%; height: auto; display: block; margin: 0 auto; border-radius: 6px; }
.q-para img.q-material-img { max-width: 100%; height: auto; vertical-align: middle; border-radius: 4px; }
/* 数据驱动绘制的结构化材料（SVG 柱状图 / HTML 表格） */
.q-chart-svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
.q-struct-table { border-collapse: collapse; margin: 4px auto; font-size: 13px; }
.q-struct-table th, .q-struct-table td { border: 1px solid #000; padding: 5px 14px; text-align: center; white-space: nowrap; }
.q-struct-table th { font-weight: 600; background: #fff; }
.q-struct-table td:first-child { text-align: left; }
.q-struct-table-title { font-size: 15px; font-weight: 600; margin: 8px 0 4px; text-align: center; }
.q-struct-table-wrap { margin: 10px 0; }
/* 同材料多题聚合 */
.question-group { border: 1px dashed var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; background: var(--bg2); }
.question-group .group-material { position: relative; margin-bottom: 4px; padding: 4px 2px 8px; }
.question-group .group-material-title { font-size: 13px; font-weight: 600; color: var(--primary); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.mat-draw-btn { padding: 1px 10px; font-size: 12px; }
.question-group .group-questions .question-card { box-shadow: none; border: 1px solid var(--border); margin-bottom: 12px; }
.question-group .group-questions .question-card:last-child { margin-bottom: 0; }
.q-options { margin-bottom: 10px; }
.q-option {
  font-size: 14px; padding: 5px 0 5px 18px; color: #374151;
  border-radius: 6px; text-align: justify; text-justify: inter-ideograph;
}
.q-option:hover { background: #f9fafb; }
.q-option { cursor: pointer; user-select: text; transition: background .15s ease, color .15s ease; }
.q-option.selected { background: var(--primary-soft); }
.q-option.correct { background: #e8f7ef; color: var(--green); font-weight: 600; }
.q-option.wrong { background: #fdecec; color: var(--red); font-weight: 600; }
/* 手写圈画层 */
.q-draw { position: absolute; inset: 0; z-index: 10; pointer-events: none; border-radius: var(--radius); overflow: hidden; }
.q-draw-img { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; object-fit: fill; }
.q-draw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; pointer-events: none; cursor: crosshair; touch-action: none; }
.q-draw-canvas.active { display: block; pointer-events: auto; }
/* 圈画激活：仅禁止文本选择与长按菜单，不禁止滚动/点击；滚动锁定在真正落笔时通过 lockScrollChain 按需启用 */
.q-draw-active, .q-draw-active * { user-select: none !important; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
/* 圈画激活期间挂到 body 的全局防护：覆盖卡片外文本，阻止系统文本选择浮层（拷贝/查询/翻译） */
body.q-draw-global, body.q-draw-global * { user-select: none !important; -webkit-user-select: none !important; -webkit-touch-callout: none !important; }
.q-draw-toolbar {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 12;
  display: none; align-items: center; gap: 6px; flex-wrap: nowrap;
  background: rgba(255,255,255,.96); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 9px; box-shadow: 0 4px 14px rgba(15,23,42,.16);
  pointer-events: auto; white-space: nowrap;
}
.q-draw-toolbar.open { display: flex; }
.q-draw-tbtn {
  border: 1px solid var(--border); background: #fff; color: var(--text);
  border-radius: 16px; padding: 3px 11px; font-size: 12px; cursor: pointer;
  font-family: inherit; transition: all .15s;
}
.q-draw-tbtn:hover { border-color: var(--primary); color: var(--primary); }
.q-draw-tbtn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.q-draw-tbtn.danger { color: var(--red); border-color: #f3c2c5; }
.q-draw-tbtn.danger:hover { border-color: var(--red); color: var(--red); }
.q-draw-size { width: 72px; accent-color: var(--primary); cursor: pointer; vertical-align: middle; }
.q-draw-size-label { font-size: 11px; color: var(--muted); min-width: 26px; text-align: center; }
.q-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.mastery-group { display: flex; gap: 6px; }
.mastery-btn {
  border: 1px solid var(--border); background: #fff; color: var(--muted);
  border-radius: 20px; padding: 4px 13px; font-size: 12px; cursor: pointer;
  transition: all .18s ease; font-family: inherit;
}
.mastery-btn:hover { border-color: #c0c4cc; transform: translateY(-1px); }
.mastery-btn.weak.active { background: #fdecec; border-color: var(--red); color: var(--red); font-weight: 600; box-shadow: 0 2px 8px rgba(229,72,77,.18); }
.mastery-btn.ok.active { background: #e8f7ef; border-color: var(--green); color: var(--green); font-weight: 600; box-shadow: 0 2px 8px rgba(24,160,88,.18); }
.mastery-btn.review.active { background: #fdf3e0; border-color: var(--amber); color: var(--amber); font-weight: 600; box-shadow: 0 2px 8px rgba(217,138,0,.18); }
.mastery-btn.unsure.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; box-shadow: 0 2px 6px rgba(29,43,76,.14); }
.show-answer-btn { margin-left: auto; }
.question-card.capturing .q-head,
.question-card.capturing .q-foot,
.question-card.capturing .answer-panel,
.question-card.capturing .q-draw { display: none !important; }
.answer-panel {
  margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--bg2); border: 1px solid var(--border); display: none;
}
.answer-panel.open { display: block; }
.answer-panel .row { font-size: 13px; margin-bottom: 6px; text-align: justify; text-justify: inter-ideograph; }
.answer-panel .row:last-child { margin-bottom: 0; }
.answer-panel .k { font-weight: 600; }
.answer-panel .ans { color: var(--green); font-weight: 600; }
.answer-panel .reason { color: #b45309; }
.answer-panel .analysis { color: var(--primary); }

.empty { text-align: center; color: var(--muted); padding: 50px 0; font-size: 14px; }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
footer { text-align: center; color: #999999; font-size: 12px; padding: 20px 0; }

/* 打印区（默认隐藏） */
#printArea { display: none; }

/* 打印样式：仿宋、纯黑、题号重标、选项缩进两字符 */
@page { margin: 2cm 1.8cm; }
@media print {
  header, #app { display: none !important; }
  #printArea { display: block !important; }
  body {
    background: #fff;
    font-family: "FangSong", "仿宋", "FangSong_GB2312", "STFangsong", serif;
    color: #000;
  }
  .print-title { font-size: 20pt; font-weight: bold; text-align: center; margin-bottom: 4pt; }
  .print-subtitle { font-size: 14pt; text-align: center; margin-bottom: 16pt; }
  .pq { margin-bottom: 10pt; page-break-inside: avoid; }
  .pq-text { font-size: 14pt; margin-bottom: 3pt; }
  .pq-opt { font-size: 13pt; padding-left: 2em; margin-bottom: 2pt; }
  .pq-ans { font-size: 12pt; margin-top: 4pt; }
  .pq-analysis { font-size: 12pt; margin-top: 2pt; }
  .pq-divider { border: none; border-top: 0.5pt solid #bbb; margin: 8pt 0; }
}

.modal-mask { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.modal-box { background: #fff; border-radius: 12px; width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; box-shadow: 0 8px 30px rgba(0,0,0,.15), 0 2px 8px rgba(0,0,0,.06); border: 1px solid var(--border); }
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 16px; font-weight: 600; margin: 0; }
.modal-close { border: none; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; transition: color .15s; }
.modal-close:hover { color: var(--red); }
.modal-body { padding: 18px 20px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }
.upload-actions { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.upload-hint { font-size: 12px; color: var(--muted); }
.upload-status { font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 18px; }
.ai-fab {
  position: fixed; right: 22px; bottom: 26px; z-index: 200;
  width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--primary);
  color: #fff; font-size: 13px; font-weight: 700; font-family: inherit;
  box-shadow: 0 4px 12px rgba(29,43,76,.30); transition: transform .2s ease, box-shadow .2s ease;
  display: flex; align-items: center; justify-content: center; line-height: 1.2;
}
.ai-fab:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 16px rgba(29,43,76,.38); }
.ai-fab:active { transform: translateY(0) scale(1); }
.ai-chat { display: flex; flex-direction: column; height: 380px; max-height: 60vh; }
.ai-msgs { flex: 1; overflow-y: auto; padding: 6px 2px 10px; display: flex; flex-direction: column; gap: 10px; }
.ai-msg { max-width: 88%; padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.ai-msg.user { align-self: flex-end; background: var(--grad-primary); color: #fff; border-bottom-right-radius: 4px; }
.ai-msg.assistant { align-self: flex-start; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.ai-msg.err { align-self: flex-start; background: #fef2f2; color: #e5484d; border: 1px solid #f3c1c3; }
.ai-input-row { display: flex; gap: 10px; margin-top: 4px; }
.ai-input-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; font-family: inherit; outline: none; }
.ai-input-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,43,76,.12); }
.ai-thumb-wrap { display: none; align-items: center; gap: 8px; margin: 8px 0 2px; padding: 6px 8px; background: #f8fafc; border: 1px dashed var(--border); border-radius: 10px; }
.ai-thumb-wrap.show { display: flex; }
.ai-thumb-box { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-soft); flex-shrink: 0; }
.ai-thumb-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ai-thumb-x { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; line-height: 16px; text-align: center; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%; font-size: 12px; cursor: pointer; padding: 0; }
.ai-thumb-tip { font-size: 12px; color: var(--muted); }
.btn-ai-pick { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 14px; border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--text); font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn-ai-pick:hover { border-color: var(--primary); color: var(--primary); }
.ai-status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
.form-item { margin-bottom: 14px; }
.form-item label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.form-item textarea, .form-item input, .form-item select {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px;
  font-size: 14px; font-family: inherit; color: var(--text); background: #fff;
  transition: all .18s ease;
}
.form-item textarea:focus, .form-item input:focus, .form-item select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,43,76,.18); }

@media (max-width: 800px) {
  .stat-cards { grid-template-columns: repeat(2, 1fr); }
  .charts { grid-template-columns: 1fr; }
  .bar-row .name { flex-basis: 100px; }
}
/* 词典悬停释义 */
.dict-word {
  /* 词典悬浮词：不显示虚线下划线，仅保留 hover 背景提示 */
  cursor: help;
  border-radius: 3px;
  transition: background .15s ease;
}
/* 填空横线：实线渲染 */
.q-blank-line {
  display: inline-block;
  width: 4em;
  border-bottom: 2px solid var(--text);
  vertical-align: -3px;
}
.dict-word:hover { background: rgba(255, 215, 130, .28); }
.dict-tip {
  position: fixed;
  z-index: 9999;
  max-width: 340px;
  background: #FFFDF7;
  border: 1px solid #E7DCC2;
  border-radius: 8px;
  box-shadow: 0 8px 22px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.08);
  padding: 9px 13px;
  font-size: 13px;
  line-height: 1.65;
  color: #463B2B;
  pointer-events: none;
  word-break: break-word;
}
.dict-tip .dict-tip-word {
  font-weight: 700;
  color: #8A5A1B;
  margin-right: 6px;
}
/* 选中文本跳转搜索浮层 */
.search-tip {
  position: fixed;
  z-index: 9998;
  display: none;
  background: #FFFDF7;
  border: 1px solid #E7DCC2;
  border-radius: 8px;
  box-shadow: 0 8px 22px rgba(0,0,0,.15), 0 2px 6px rgba(0,0,0,.08);
  padding: 5px;
  font-size: 13px;
  color: #463B2B;
  white-space: nowrap;
}
.search-tip button {
  border: none;
  background: transparent;
  color: #6B4E2B;
  font-size: 13px;
  line-height: 1;
  padding: 8px 13px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.search-tip button:hover { background: rgba(138, 90, 27, .14); color: #8A5A1B; }
.search-tip button + button { margin-left: 3px; }

<body>
<header>
  <div>
    <h1>错题复盘平台</h1>
    <div class="sub" id="headerSub">WaytoGWY 备考 · 云端多设备 / 答题练习 / 统计 / 打印导出</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btnAI">AI 助手</button>
    <button class="btn btn-ghost" id="btnUpload">拍照上传</button>
    <button class="btn btn-ghost" id="btnRefresh">刷新数据</button>
    <button class="btn btn-primary" id="btnExport">打印导出</button>
  </div>
</header>

<div class="container" id="app">
  <div class="review-banner" id="reviewBanner" style="display:none;">
    <div class="review-banner-head" id="reviewBannerHead">
      <span class="review-banner-title">今日待复习</span>
      <span class="review-banner-badge" id="reviewCount" style="display:none;">0</span>
      <span class="review-banner-overdue" id="reviewOverdue" style="display:none;"></span>
      <span class="review-banner-done" id="reviewDone" style="display:none;">今日复习已完成</span>
      <button type="button" class="review-banner-toggle" id="reviewToggle">展开清单</button>
    </div>
    <div class="review-panel" id="reviewPanel" style="display:none;">
      <div class="review-panel-tip" id="reviewTip"></div>
      <div class="review-panel-body" id="reviewPanelBody"></div>
    </div>
  </div>

  <div class="stat-cards" id="statCards">
    <div class="stat-card total"><div class="num" id="stTotal">-</div><div class="label">错题总数</div></div>
    <div class="stat-card weak"><div class="num" id="stWeak">-</div><div class="label">未掌握</div></div>
    <div class="stat-card ok"><div class="num" id="stOk">-</div><div class="label">已掌握</div></div>
    <div class="stat-card review"><div class="num" id="stReview">-</div><div class="label">需复习</div></div>
  </div>

  <div class="charts">
    <div class="chart-card"><h3>板块错题数</h3><div id="chartCategory"></div></div>
    <div class="chart-card"><h3>题型分布</h3><div id="chartType"></div></div>
  </div>

  <div class="filter-bar">
    <div class="filter-item">
      <label>关键字</label>
      <input id="fKeyword" type="text" placeholder="搜索题干/选项/答案/解析">
    </div>
    <div class="filter-item">
      <label>板块</label>
      <select id="fCategory"><option value="">全部板块</option></select>
    </div>
    <div class="filter-item">
      <label>题型</label>
      <select id="fType"><option value="">全部题型</option></select>
    </div>
    <div class="filter-item">
      <label>掌握状态</label>
      <select id="fMastery">
        <option value="">全部状态</option>
        <option value="未掌握">未掌握</option>
        <option value="已掌握">已掌握</option>
        <option value="需复习">需复习</option>
      </select>
    </div>
    <button type="button" class="btn btn-outline clear-filter-btn" title="一键清除所有筛选条件">清除筛选</button>
    <div class="filter-count" id="filterCount"></div>
  </div>

  <div id="list"></div>
  <footer>数据来自 Supabase 云端 · 掌握状态多设备同步 · 拍照上传 AI 识别</footer>
</div>

<div class="modal-mask" id="uploadModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-head">
      <h3>拍照上传错题</h3>
      <button class="modal-close" id="btnUploadClose" type="button">&times;</button>
    </div>
    <div class="modal-body">
      <div class="upload-actions">
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;">
        <button class="btn btn-primary" id="btnPickImage" type="button">拍照 / 选择图片</button>
        <span class="upload-hint">支持相机拍照，AI 自动识别题干与选项</span>
      </div>
      <div class="upload-hint">AI 识别由智谱 GLM-4V-Flash 提供（免费）</div>
      <div class="upload-status" id="uploadStatus"></div>
      <div class="form-item">
        <label>题干</label>
        <textarea id="fQuestion" rows="4" placeholder="OCR 自动识别后回填"></textarea>
      </div>
      <div class="form-item">
        <label>选项</label>
        <textarea id="fOptions" rows="5" placeholder="OCR 自动识别后回填，每行一个选项"></textarea>
      </div>
      <div class="form-item">
        <label>答案</label>
        <input id="fAnswer" type="text" placeholder="手动填写，如 A / B / C / D">
      </div>
      <div class="form-item">
        <label>板块</label>
        <select id="fCategoryNew"><option value="">请选择板块</option></select>
      </div>

        <textarea id="fAnalysis" rows="3" placeholder="手动填写解析（可选）"></textarea>

      <button class="btn btn-primary" id="btnUploadSave" type="button">保存错题</button>

</div>

<div class="modal-mask" id="categoryModal" style="display:none;">

      <button class="modal-close" id="btnCategoryClose" type="button">&times;</button>

</div>

<div class="modal-mask" id="editModal" style="display:none;">

      <button class="modal-close" id="btnEditClose" type="button">&times;</button>

        <label>选项</label>
        <textarea id="fEditOptions" rows="5" placeholder="每行一个选项"></textarea>
      </div>
      <div class="form-item">
        <label>答案</label>
        <input id="fEditAnswer" type="text" placeholder="如 A / B / C / D">
      </div>
      <div class="form-item">
        <label>板块</label>
        <select id="fEditCategory"><option value="">请选择板块</option></select>

      <div class="form-item">
        <label>解析</label>
        <textarea id="fEditAnalysis" rows="3" placeholder="解析内容（可选）"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="btnEditCancel" type="button">取消</button>
      <button class="btn btn-primary" id="btnEditSave" type="button">保存修改</button>
    </div>
  </div>
</div>

<button class="ai-fab" id="btnAIFab" type="button" title="AI 助手">AI<br>助手</button>
<div class="modal-mask" id="aiModal" style="display:none;">
  <div class="modal-box">

      </div>
    </div>

</div>

<script>
window.IDIOM_DICT = {"司空见惯":"源自唐刘禹锡诗'司空见惯浑闲事'。本义：司空（官名）看惯了，不以为奇；引申：见得多了，习以为常，不足为奇。","天马行空":"源自《汉书》。本义：天马（神马）奔驰于天空，毫无阻碍；引申：①气势豪放、才思纵横；②形容不切实际、任意驰骋，缺少约束。","众所周知":"大家都知道的。指事情极为普遍、公开，无需说明。","欣欣向荣":"源自陶渊明《归去来兮辞》。本义：草木茂盛、生机勃勃；引申：事业、景象蓬勃发展、蒸蒸日上。","天花乱坠":"源自佛经故事。本义：法师说法感动上天，天花纷纷坠落；引申：形容说话动听而不切实际，多含贬义。","喜闻乐见":"喜欢听、乐意看。形容很受欢迎、受大众喜爱。","一脉相承":"本义：由一个血统或派别世代流传下来；引申：某种思想、学说、传统前后继承、渊源一致。","薪火相传":"源自《庄子·养生主》'薪尽火传'。本义：柴烧尽火种仍留传；引申：学问、技艺、传统代代相传不绝。","栩栩如生":"源自《庄子·齐物论》。本义：栩栩（生动活泼的样子），形容画作、雕塑等艺术形象逼真，像活的一样。","摩肩接踵":"本义：肩碰肩、脚碰脚；引申：形容人多拥挤，络绎不绝。","浅显易懂":"文字、道理浅近明白，容易理解。","晦涩难懂":"文字隐晦艰深，不易理解。","晶莹剔透":"本义：器物光亮透明，精致无瑕；引申：形容玉石、冰雪等清澈明亮，也可喻心灵纯净。","不足为奇":"不值得奇怪。形容事情很平常，没有什么特殊之处。","筚路蓝缕":"源自《左传》'筚路蓝缕，以启山林'。本义：驾着柴车、穿着破衣去开辟山林；引申：形容创业艰辛。","舟车劳顿":"本义：乘车坐船奔波劳累；引申：形容长途旅行疲惫不堪。","栉风沐雨":"源自《庄子·天下》'沐甚雨，栉疾风'。本义：以风梳发、以雨洗头；引申：形容奔波劳碌、不避风雨。","百舍重趼":"源自《庄子·天道》。本义：百里一宿、脚底磨出厚茧；引申：形容长途跋涉、非常辛苦。","方兴未艾":"本义：正在兴起、尚未停止；引申：事物正处在蓬勃发展时期，势头正盛。","饱经沧桑":"本义：饱经世事变迁（沧海变桑田）；引申：经历丰富、久经世事磨难。","通俗易懂":"内容浅显、大众化，容易理解。","分秒之间":"极短的时间之内，形容时间非常短促。","毋庸置疑":"无须怀疑。指事实或道理非常明确。","毋庸赘言":"无须多说、不必啰嗦。指道理已明，不必重复。","顷刻之间":"极短的时间，片刻之间。","不言自明":"不用说明就能明白。指道理、事实一目了然。","毫厘之间":"极小、极细微的差别之内；形容差距微乎其微。","刹那之间":"极短暂的一瞬之间。","同心协力者成":"短语：能够同心协力、团结一致的人才能取得成功（多与'风雨同舟者兴'等对仗）。","众志成城者强":"短语：众人意志凝聚如城墙，这样的人（团队）才会强大。","上下同欲者胜":"短语：源自《孙子兵法》，上下一条心、目标一致的人才能取胜。","荣辱相依者旺":"短语：荣与辱相互依存、共进退的群体才会兴旺。","砥柱中流":"本义：像三门峡砥柱山一样屹立在黄河急流中；引申：比喻在艰难环境中起支柱作用的人或力量。","稳如泰山":"本义：像泰山一样稳固；引申：形容地位、形势极其稳固，不可动摇。","海纳百川":"本义：大海容纳众多河流；引申：胸怀宽广、包容万物，或指气度宏大。","凤凰涅槃":"本义：凤凰浴火重生（涅槃为佛教语，指超脱生死）；引申：历经磨难后获得重生、升华。","人心沉浮":"人心起落不定、情绪波动；也指民心向背多变。","人心向背":"本义：人们拥护或反对；引申：指民心的趋向，决定成败的关键。","众望所归":"本义：众人的期望都归向某人；引申：指某人深得人心，威望很高，受到大家拥戴。","人心所向":"本义：民众所向往、拥护的；引申：指顺应民心、大势所趋。","与时俱进":"本义：与时代一同前进；引申：指思想、做法随时代发展而更新、进步。","习以为常":"本义：经常做某事而成为习惯；引申：指某种现象见多了，觉得平常。","熟视无睹":"本义：经常看到却像没看见一样；引申：对身边事物漠不关心、视而不见。","家常便饭":"本义：家中日常的饭食；引申：比喻常见、平常的事情。","日新月异":"本义：每天每月都有新的变化；引申：形容发展进步很快，不断出现新事物。","望眼欲穿":"本义：眼睛都快望穿了；引申：形容盼望殷切、等待心切。","翘首以盼":"本义：抬起头来等待；引申：形容殷切期待、盼望。","津津乐道":"本义：津津（兴趣浓厚的样子），乐于谈论；引申：很有兴趣地谈论不停。","生搬硬套":"本义：不顾实际，机械地搬用别人的方法经验；引申：指脱离实际地照搬照抄。","兴利除弊":"源自《管子》。本义：兴办有利的事、除去弊端；引申：改革弊政，振兴事业。","闭门造车":"本义：关起门来造车（古语认为只要按规矩，出门也能合辙）；后转义：脱离实际、凭主观想象办事。","团门造车":"疑为'闭门造车'的误写。正确释义：关起门来造车，比喻脱离实际、凭主观臆断行事。","革故鼎新":"源自《周易》'革故鼎新'。本义：去掉旧的、建立新的（鼎为烹饪之器，喻更新）；引申：破旧立新，进行改革。","墨守成规":"本义：战国墨翟善于守城，后转指固守旧法；引申：思想保守，守着老规矩不肯改变。","因势利导":"源自《史记》。本义：顺着事物发展的趋势加以引导；引申：依据客观形势进行引导，使达到有利方向。","削足适履":"源自《淮南子》。本义：把脚削小去适应鞋子的尺码；引申：比喻不合理地迁就、生搬硬套。","因地制宜":"本义：根据当地的具体情况制定适宜的措施；引申：处理问题要从实际出发、灵活变通。","不折不扣":"本义：不打折扣；引申：完全的、十足的、彻头彻尾。","活灵活现":"形容描述、表演生动逼真，像真的一样。","如假包换":"本义：如果是假货可以包退换；引申：强调事物货真价实、确定无疑。","波谲云诡":"源自汉代扬雄语。本义：如波浪、云彩般变化莫测；引申：形容事物变幻莫测、难以捉摸，多含贬义。","玉石不分":"本义：玉和石头混在一起分辨不清；引申：比喻好坏、是非不分，善恶混杂。","数不胜数":"数也数不过来。形容数量极多。","风起云涌":"本义：大风刮起、乌云涌聚；引申：形容事物迅速发展、声势浩大，或局势剧烈变化。","良莠不齐":"本义：好苗与杂草混在一起；引申：好人坏人、好事物坏事物混杂，水平参差不齐。","不胜枚举":"本义：无法一一列举（枚：个）；引申：同类事物数量极多，列举不完。","目迷五色":"源自《老子》。本义：被各种颜色迷惑；引申：事物错综复杂，令人眼花缭乱、辨不清方向。","不一而足":"本义：不是一种或一次就够；引申：同类事物或情况很多，不止一种。","异军突起":"源自《史记》。本义：另外一支军队突然兴起；引申：新生力量突然出现，势头强劲。","泥沙俱下":"本义：泥土沙子一起冲下来；引申：好坏混杂，鱼龙混杂，多与'鱼目混珠、良莠不齐'同类。","擢发难数":"源自《史记》。本义：拔下全部头发也数不清（擢：拔）；引申：形容罪行多到无法计算。","熙熙攘攘":"源自《史记·货殖列传》。本义：形容人来人往、喧闹纷杂；引申：形容热闹拥挤。","川流不息":"源自《论语》。本义：河水流动不停；引申：行人、车马等像水流一样连续不断。","络绎不绝":"本义：接连不断（络绎：连续不断的样子）；引申：形容人、车、船等往来不断。","显而易见":"事情或道理很明显，容易看清楚。","扑朔迷离":"源自《木兰诗》'雄兔脚扑朔，雌兔眼迷离'。本义：雄雌难辨；引申：事情复杂、头绪不清，难以辨明真相。","错综复杂":"本义：纵横交错、头绪繁多；引申：形容情况复杂，互相牵连。","如出一辙":"本义：像出自同一车辙；引申：形容言论、行动非常相似，几乎一样。","一成不变":"本义：一经形成就不再改变；引申：形容墨守成规、不知变通。","玲珑剔透":"本义：器物精巧细致、孔穴明晰；引申：形容器物精致或人聪明灵巧。","一模一样":"形容完全相同，没有差别。","光亮通明":"明亮透彻、光线充足。","千篇一律":"本义：一千篇文章都是一个样子；引申：形容公式化、毫无变化。","人山人海":"形容人聚集得极多，像山像海一样。","人满为患":"本义：人多到成为祸患；引申：形容人太多，造成拥挤或负担。","万人空巷":"本义：家家户户的人都从巷子里出来；引申：形容庆祝、欢迎等盛况空前。","千奇百怪":"形容事物奇异古怪，形形色色。","纵横交错":"本义：横竖交叉在一起；引申：形容事物相互交织、错落复杂。","大开大合":"本义：大规模地张开、合拢；引申：形容气势宏大、变化剧烈，或思路开阔、不拘小节。","跌宕起伏":"本义：音调、文章起伏多变；引申：形容情节、局势、心境等变化大、不稳定。","走马观花":"源自唐孟郊诗'春风得意马蹄疾，一日看尽长安花'。本义：骑在马上看花；引申：粗略地观察事物，不深入。","字斟句酌":"本义：一字一句地斟酌推敲；引申：形容写作、说话十分慎重，用词考究。","囫囵吞枣":"本义：不加咀嚼地把整个枣吞下；引申：比喻读书、理解不加分析，笼统接受。","字里行间":"指文章的词语之间、字句之中，常用来指隐含在文字中的意思。","一目十行":"本义：一眼看十行字；引申：形容阅读速度快，也含粗心大意、不深入之意。","全神贯注":"本义：全部精神集中在一点上；引申：形容注意力高度集中。","漫不经心":"本义：随意、不放在心上；引申：形容做事马虎、不专心。","片言只语":"本义：零碎简短的几句话；引申：形容语言零碎、不完整。","心烦意乱":"本义：心里烦躁、思绪纷乱；引申：形容心情焦躁不安。","拍案叫绝":"本义：拍桌子叫好（绝：妙极）；引申：形容对文章、表演等极为赞赏。","急功近利":"本义：急于求成、贪图眼前利益；引申：形容目光短浅，追求近期功效。","脍炙人口":"本义：切细的肉和烤熟的肉都受人喜爱（脍、炙：佳肴）；引申：比喻诗文等受人传诵、欢迎。","好高骛远":"本义：不切实际地追求过高过远的目标（骛：追求）；引申：形容脱离实际、眼高手低。","交口称赞":"本义：众人齐声称赞；引申：大家一致好评。","心浮气躁":"本义：心里浮躁、沉不住气；引申：形容性情急躁、缺乏耐心。","唯我独尊":"源自佛典'天上天下，唯我独尊'。本义：只有我最尊贵；引申：自高自大、目中无人。","高高在上":"本义：所处位置很高；引申：形容脱离群众、脱离实际，摆官架子。","固步自封":"本义：固守原来的步伐、限制自己（步：走）；引申：不求进步、安于现状。","顾此失彼":"本义：顾了这个，丢了那个；引申：形容无法全面照顾，忙乱不暇。","厚此薄彼":"本义：重视这一方、轻视那一方；引申：形容对待不公、有偏袒。","轻重失宜":"本义：轻重的处理失去分寸；引申：指主次、缓急安排不当。","此消彼长":"本义：这个下降，那个上升；引申：形容两方面相互对立、交替变化。","妙趣横生":"本义：美妙的意趣层出不穷；引申：形容语言、文章等富有情趣。","出神入化":"本义：超越神妙、进入化境；引申：形容技艺、学问达到极高的境界。","风花雪月":"本义：四季自然美景（风、花、雪、月）；引申：①描写风花雪月等景物的诗文；②男女情爱之事；③空泛华丽、脱离实际的言辞。","恩威并施":"本义：恩惠与威严同时使用；引申：指管理者既施恩又立威，赏罚并用。","宽严相济":"本义：宽大与严格相互配合；引申：指处理问题宽严适度、相互补充。","不偏不倚":"源自《礼记》。本义：不偏向任何一方（倚：偏）；引申：公正中立，不偏袒。","赏罚分明":"本义：奖赏与惩罚界限清楚；引申：指管理公正、功过分明。","待价而沽":"源自《论语》'沽之哉，沽之哉，我待贾者也'。本义：等待高价出卖；引申：比喻等待好的待遇或时机才肯效力。","滥竽充数":"源自《韩非子》南郭先生故事。本义：不会吹竽的人混在乐队里充数；引申：无真才实学的人混在行家里面凑数。","奇货可居":"源自《史记》吕不韦故事。本义：把稀有的货物囤积起来等待高价；引申：凭借某种事物或条件待价而沽、谋取利益。","一枝独秀":"本义：一枝花独自开得鲜艳；引申：形容在同类中最突出、最优秀。","趋之若鹜":"本义：像鸭子一样成群跑过去（鹜：鸭子）；引申：形容很多人争着前往，多含贬义。","从容不迫":"本义：不慌不忙、非常镇定；引申：形容态度沉着、遇事不乱。","沧海桑田":"源自《神仙传》。本义：大海变成桑田、桑田变成大海；引申：形容世事变化巨大。","如火如荼":"本义：像火那样红、像荼（茅草白花）那样白；引申：形容气势旺盛、热烈。","纷至沓来":"本义：纷纷到来、接连不断（沓：重复）；引申：形容事物、人接踵而来。","踌躇满志":"源自《庄子·养生主》。本义：心满意足、从容自得的样子（踌躇：从容自得）；引申：形容对自己取得的成就非常得意。","饱经风雨":"本义：经历了很多风雨；引申：比喻经历过很多艰难困苦的考验。","轰轰烈烈":"本义：形容声势浩大、气魄雄伟；引申：形容事业、运动等规模大、影响广。","接踵而至":"本义：脚跟脚地到来（踵：脚后跟）；引申：形容人、事接连不断地到来。","胸有成竹":"源自宋苏轼论画竹。本义：画竹前心中已有完整的竹子形象；引申：事前已有全面考虑和把握，做事有把握。","心驰神往":"本义：心神奔向所向往的地方；引申：形容一心向往、非常渴望。","信心百倍":"本义：信心增长到百倍；引申：形容充满信心、干劲十足。","一往情深":"本义：对人或事物有深厚的感情，一往而不收；引申：形容感情深挚、专注。","羚羊挂角":"源自《景德传灯录》。本义：传说羚羊夜宿时角挂树上、脚不着地，猎人无迹可寻；引申：比喻诗文意境超脱、不着痕迹。","一如既往":"本义：完全像从前一样；引申：形容态度、做法始终不变。","雪泥鸿爪":"源自苏轼诗'泥上偶然留指爪，鸿飞那复计东西'。本义：鸿雁在雪泥上留下的爪印；引申：比喻往事留下的痕迹。","一气呵成":"本义：一口气完成（呵：呼气）；引申：形容文章、动作等连贯紧凑、毫无间断。","神来之笔":"本义：仿佛神仙写出的笔墨；引申：形容极其精彩的文句或构思，非人力所及。","一见倾心":"本义：初次见面就心生爱慕；引申：形容一见即被吸引、产生好感。","知易行难":"本义：懂得道理容易，付诸行动困难；引申：强调实践比认知更难、更关键。","多管齐下":"本义：多根管道同时放水；引申：多方面同时采取措施、齐头并进。","有利可图":"本义：有利益可以谋取；引申：指存在获取利益的余地。","不明所以":"本义：不明白原因是什么（所以：原因）；引申：指对事情缘由不清楚。","齐心协力":"本义：心往一处想、劲往一处使；引申：形容团结一致、共同努力。","有凭有据":"本义：有凭证、有依据；引申：形容说话、做事有事实根据。","拒之门外":"本义：把某人挡在门外；引申：拒绝接纳、不予理会。","统筹兼顾":"本义：统一筹划、全面照顾；引申：指安排工作时通盘考虑、各方面都顾及。","有增无损":"本义：只有增加没有减少；引申：形容情况持续加重、没有好转。","望而却步":"本义：看到了就往后退；引申：形容因困难、危险而不敢前进。","集思广益":"源自诸葛亮《教与军师长史参军掾属》。本义：集中众人的智慧、广泛吸取有益意见；引申：发扬民主、群策群力。","有机可乘":"本义：有空子可以钻（机：机会）；引申：指有可利用的机会或漏洞，多含贬义。","捞稻草":"惯用语。本义：落水者抓捞漂浮的稻草；引申：比喻在绝望中抓住不可靠的东西做无济于事的挣扎。","泡蘑菇":"惯用语。本义：蘑菇浸泡后膨胀拖时间；引申：故意拖延时间、磨蹭；也可指软磨硬泡地纠缠。","催化剂":"本义：化学中能改变化学反应速度而自身不变的物质；引申：比喻促使事物发生变化的推动因素。","新引擎":"本义：新型发动机；引申：比喻推动发展的新动力、新增长点。","动力源":"本义：动力的来源；引申：比喻推动事业发展的根本力量。","加速器":"本义：使速度加快的装置；引申：比喻推动事物快速发展的力量或机制。","探索家":"本义：从事探索的人；引申：指敢于开拓、不断摸索新领域的人。","旁观者":"本义：在旁边观看的人；引申：比喻置身事外、不参与其中的人。","主攻手":"本义：球队中担任主要进攻的队员；引申：比喻承担主要任务、冲在最前的人。","纸老虎":"本义：纸做的老虎；引申：比喻外表强大、实际虚弱的势力。","实践家":"本义：注重实践的人；引申：指善于把理论付诸行动的人。","理论家":"本义：从事理论研究的人；引申：指擅长阐述、构建理论而可能脱离实际的人。","领跑者":"本义：赛跑中跑在最前面的人；引申：比喻行业、领域中的领先者。","墙头草":"惯用语。本义：长在墙头上的草，随风倒；引申：比喻立场不稳、见风使舵的人。","行动者":"本义：动手去做的人；引申：强调执行力强、用行动说话的人。","清谈客":"本义：只爱空谈的人；引申：讽刺只会高谈阔论、不务实干的人。","奋斗者":"本义：努力拼搏奋斗的人；引申：指为理想不懈努力的人。","泥菩萨":"惯用语。本义：泥塑的菩萨像；引申：比喻外表貌似有威严、实际自身难保、经不起考验的人。","搏击者":"本义：奋力搏斗的人；引申：比喻敢于迎难而上、顽强拼搏的人。","假把式":"惯用语。本义：花架子、不实用的招式；引申：比喻徒有其表、没有真本事的人或做法。","挑战者":"本义：发出挑战的人；引申：指勇于向强者、权威发起竞争的人。","井底蛙":"源自《庄子》。本义：井底的青蛙；引申：比喻见识短浅、眼界狭窄的人。","擘画":"筹划、谋划、安排（擘：分开，引申为筹划）。书面语，如'擘画蓝图'。","描摹":"照着原样描绘、摹写；引申为刻画、描写。","迎合":"为了讨好或适应对方而故意使自己的言行符合其心意，多含贬义。","推行":"普遍实行、推广执行（政策、制度等）。","保障":"①保护生命、财产等不受侵犯；②起保障作用的事物。","踌躇":"①犹豫不决，拿不定主意；②（踌躇满志时）从容自得的样子。","踯躅":"徘徊不前、犹豫不决；也指踏步不前。与'踌躇'义近。","消失":"事物逐渐减少以至没有、不复存在。","情感":"对外界刺激产生的心理反应，如喜、怒、哀、乐等。","洞察":"观察得非常清楚透彻，能看穿事物的本质。","修剪":"用剪刀修整（枝叶、指甲等），使之整齐。","明察":"仔细观察、清楚地看到；也指目光敏锐、明辨是非。","剔除":"把不合适、不需要的部分挑出并去掉。","凝聚":"①气体由稀变浓或凝结；②聚集、积聚（力量、心血等）。","发出":"①向外送出、放出（声音、命令、信号等）；②发表（意见）。","汇聚":"聚集到一起，如'汇聚力量'。","奏出":"演奏出（乐曲、旋律）。","推进":"①推动工作、事业等前进；②（军队）向前进。","现实":"①客观存在的事物和情况；②合乎客观情况的（想法、态度）。","置疑":"怀疑（多用于否定式），如'毋庸置疑、不容置疑'。","论证":"①论述并证明；②立论的根据。","解构":"①（结构上）分解、拆解；②后现代哲学批评术语，指对文本、观念进行消解分析。","怀疑":"①疑惑、不相信；②猜测。","检验":"检查并验证（是否合格、正确），如'检验真理'。","分析":"把事物分解成若干部分加以认识；与'综合'相对。","概括":"把事物的共同特点归结在一起；也指简明扼要地总说。","推理":"从一个或几个已知判断推出新判断的思维过程。","判断":"①断定是非、真假、对错；②思维的基本形式之一。","质疑":"提出疑问、加以怀疑，如'质疑问难'。","检视":"检查审视、察看。与'检验'相比侧重查看，不一定验证结果。","拆解":"拆开分解；也指对问题、结构的解析。","眷顾":"关心照顾、眷念垂爱，多用于长辈、命运对后辈的关照。","等待":"不采取行动，直到所期望的人或事物到来。","厚待":"优厚地对待、款待。","照顾":"①关心照料；②考虑、顾及（照顾到各方面）。","对待":"以某种态度、方式处理人或事物。","青睐":"用青眼（黑眼珠）看人，表示喜爱、看重（与'白眼'相对）。","优待":"给予好的待遇，特别照顾。","相信":"认为正确、可靠而不怀疑。","信赖":"信任并依赖。","信任":"相信而敢于托付。","信服":"相信并佩服。","内化":"把外在的规范、知识转化为内在的自觉观念或行为准则。","认同":"①认为跟自己有共同之处；②承认、认可。","铭记":"牢牢记住，刻在心里。","服从":"遵照、听从（命令、安排等）。","记载":"把事情写下来；也指记录事情的文字。","遵循":"遵照、依照（原则、规律等）执行。","整合":"把零散的东西通过整顿、协调重新组合为一个整体。","偶然性":"事物发展中并非必定如此、可以出现也可以不出现的性质。","持续性":"连续不断、长期保持下去的性质。","集中性":"把分散的事物汇聚于一点的性质。","极端性":"达到极点、走向过头的性质。","兴起":"①开始出现并蓬勃发展；②因感动而奋起。","满足":"①感到足够、称心；②使需要得到实现（满足需求）。","监督":"察看并督促。","升级":"①等级、档次由低向高提升；②（冲突、矛盾）激化。","注重":"重视、把注意力放在某方面。","聚焦":"①使光线或视线集中于一点；②引申为把注意力集中在某方面。","顺应":"顺从、适应（趋势、民意等）。","强化":"加强、使坚固（与'弱化'相对）。","普及":"普遍推广，使大众化。","脱胎":"①道家指脱去凡胎成仙；②比喻由某一事物演化而来（脱胎于…）。","媒介":"使双方发生关系的人或事物，如传播媒介、媒介物。","肇始":"开始、发端（肇：开始），书面语，如'由此肇始'。","载体":"承载知识、信息等的物质或工具，如'语言是文化的载体'。","发轫":"本义：行车前撤去支车轮的木（轫），喻事情开始、开端。","纽带":"起联系作用的人或事物，如'友谊的纽带'。","孕育":"怀胎生育；引申为在事物内部酝酿、发展而产生（新事物）。","引擎":"发动机；引申为推动事物发展的动力机制。","藐视":"轻视、小看，含不放在眼里之意。","蔑视":"轻蔑鄙视，比'藐视'贬义更重。","轻视":"不重视、不认真对待。","诬蔑":"捏造事实败坏他人名誉，同'污蔑'。","挤占":"强行挤入并占据（空间、时间、资源等）。","争抢":"争着抢夺。","夺取":"①用强力取得；②努力争取（夺取胜利）。","占领":"①用武装力量取得（阵地、领土）；②占据（市场、位置）。","桎梏":"本义：脚镣手铐；引申为束缚、限制人的事物。","窠臼":"本义：鸟兽巢穴；引申为老套子、旧格式（不落窠臼）。","陈套":"陈旧的格式、老一套。","定局":"①确定不变的形势、结局；②做出最后决定。","推动":"使事物前进或发展；与'拉动'相对。","降低":"使下降、使程度减弱。","促使":"推动、催促使达到某种目的或产生某种结果。","缺乏":"没有或不够（多指应有的东西）。","导致":"引起、造成（多指不好的结果）。","枯竭":"（水源、资源、精力等）干涸、断绝、用尽。","驱使":"①强迫人按自己意志行事；②推动（被利益驱使）。","基因":"遗传的基本单位；引申为事物内在的根本因素。","积淀":"长期积累沉淀（下来的成果、文化等）。","传承":"传授和继承（文化、技艺等）。","底蕴":"①内在的修养、内涵；②事情蕴藏的底细。","脉络":"本义：血管经络；引申为事物发展的条理、头绪、内在联系。","土壤":"本义：泥土；引申为事物生长、发展的基础条件（文化土壤）。","流变":"流动变化、演变（如'词义的流变'）。","根基":"基础、根本（房基、根底）。","人性化":"符合人的需求与感受、富有人情味的设计或做法。","休闲":"休息、消闲，轻松度过空闲时间。","精细化":"把工作、管理做细做精，追求准确与质量。","个性化":"具有个人特点、与众不同的特性。","生活":"①人的生存活动、日常起居；②过日子（生活水平）。","便捷化":"使更加方便、快捷。","服务":"为他人、集体利益而工作；也指提供的劳务或便利。","关键性":"起决定作用的、最为重要的性质。","呈现":"显出、露出（呈现出一派新气象）。","综合性":"由多部分、多学科、多方面组合而成的性质。","描绘":"描画；引申为用语言文字形象地描写。","普及性":"广泛推广、人人都能接受的性质。","临摹":"照着字画摹写、模仿学习。","基础性":"作为根基、起支撑作用的性质。","勾勒":"用线条画出轮廓；引申为简要地描写、概括。","贯彻":"彻底实现、落实（方针、政策、精神等）。","保障性":"起保障作用、用于兜底的性质（保障性住房）。","落实":"①使计划、措施等切实实行；②（政策）得到执行。","公益性":"为公众利益服务、不以营利为目的的性质。","履行":"实行（承诺、义务、职责等）。","协作性":"多方配合、协同工作的性质。","惠民性":"给人民群众带来实惠的性质。","时空":"时间和空间的合称。","意义":"①语言文字等所表达的含义；②价值、作用（意义重大）。","地域":"面积相当大的一块地方、地区范围。","初衷":"最初的心愿、本意。","环境":"①周围的地方、条件；②社会环境、自然条件的总称。","作用":"①对事物产生影响；②产生的效果、功能。","信息":"音信、消息；泛指经传递、处理的有意义的内容。","目的":"想要达到的目标、境地。","诉说":"带感情地向人陈述、倾吐。","倾诉":"把心里话尽情地说出来。","倾听":"细心地听取（多指虚心听取意见）。","传达":"把一方的意思转告给另一方。","珍惜":"珍重爱惜，不使受损或浪费。","释放":"①放出被拘押的人、被囚禁的能量；②把情绪、压力宣泄出来。","抢抓":"抢先抓住（机遇等），如'抢抓机遇'。","跃升":"跳跃式上升、迅速提升。","把握":"①握、拿；②抓住（本质、时机）；③成功的可靠性（有把握）。","提升":"①提高（水平、地位、质量）；②向高处送。","用好":"充分利用、善加运用。","灌注":"①浇灌、注入（水、液体）；②把心血、精力倾注进去。","灌溉":"把水引到田地里浇灌农作物。","灌输":"①把流水引到需要水的地方；②把思想、知识等强行输送、传授给他人。","灌制":"把声音、节目等录制到唱片、磁带、光盘上。","市场":"①商品交换的场所；②商品流通的领域、行情。","创造":"想出新方法、建立新理论、做出新成绩或新事物。","潜力":"潜在的、尚未发挥出来的能力或力量。","改变":"①事物发生显著差别、变化；②使变化。","留住":"使留下、不离开；保存住。","前景":"将要出现的景象、未来的发展情况。","整改":"整顿并改革、改进（针对问题）。","潜能":"潜在的能力、能量。","调整":"改变原有情况，使适应新要求（调整价格、调整结构）。","吸引":"把别人的注意力、兴趣等引到自己方面。","途径":"路径；引申为解决问题的方法、门路。","途经":"中途经过（某地），与'途径'不同，是动词。","阐释":"阐明并解释，侧重把道理讲清楚。","路径":"道路；引申为办事的门路、办法、路线。","阐发":"阐述并发挥（其中的道理、含义）。","路子":"口语：门路、办法、途径。","阐明":"把道理讲明白，如'阐明观点'。","超越":"越过、超过（前人、界限、自我）。","违背":"违反、不遵守（诺言、规律、意愿等）。","逃脱":"逃跑脱身、摆脱（责任、束缚）。","无视":"不放在眼里、根本不理会。","平衡":"①物体受力后静止的状态；②各方面数量、力量相当、保持稳定。","兼顾":"同时照顾到几个方面。","对等":"双方地位、待遇、权力等相当。","协调":"①配合适当、步调一致；②使各方面配合得当。","务实":"注重实际、讲究实效，不尚空谈。","世故":"①处世经验丰富、圆滑，多含贬义（人情世故）；②处世经验。","市侩":"本指买卖的中间人；引申为唯利是图、庸俗可厌的人或习气。","保护":"尽力照顾使不受损害。","创新":"①抛开旧的、创造新的；②新方法、新事物。","传播":"广泛散布、传递（信息、思想、疾病等）。","开发":"①以荒地、矿山等为对象进行开拓利用；②发掘（人才、潜力）。","消遁":"消失、隐退，书面语。","消除":"使不存在、除去（隐患、疑虑）。","消弭":"消除、平息（灾祸、隐患），书面语，如'消弭风险'。","眷恋":"深切地留恋（故土、亲人等），书面语。","眷念":"想念、怀念，书面语，与'眷恋'义近，侧重思念。","激情":"强烈而激动的情感，如'满怀激情'。","遏止":"用力阻止、制止（多用于势力、潮流），如'遏止通货膨胀'。","抑制":"①控制、压住（情绪、欲望）；②生理上使机能减弱。","抵消":"两种作用相互消除、互相中和。","约束":"限制使不越出范围、管束。","隔绝":"隔断、断绝联系，互不相通。","协作":"若干人或单位互相配合完成工作。","隔空":"隔着一定距离（进行交流、互动），如'隔空对话'。","虚空":"①空虚、空无；②空间、天空（佛教指超离色相的空）。","浅层":"表面的、不深的层次。","深度":"①深浅的程度；②触及事物本质的深刻程度。","自律":"自己约束自己、自觉遵守规则。","紧迫感":"时间紧迫、任务紧急的强烈感受。","自重":"①注意自己的言行、尊重自己的人格；②（机器等）自身的重量。","使命感":"对承担的任务、责任的强烈自觉意识。","自觉":"①自己有所认识而主动去做；②自我意识。","危机感":"对潜在危险、困境的警觉与忧患意识。","自强":"自己努力向上、奋发图强。","责任感":"自觉做好分内事、勇于担当责任的意识。","消解":"消释、解除（矛盾、疑虑、压力等）。","个体化":"以个人为单位、突出个体差异的趋势。","稀释":"①在溶液中加入溶剂使浓度降低；②引申为使某种东西变淡、减弱。","原子化":"比喻个体像原子一样彼此孤立、缺乏联系的社会状态。","分化":"①性质相同的事物向不同方向发展变化；②使关系破裂、分裂。","原始化":"退化到原始、简单状态。","离散":"分散、分离，不能团聚。","大众化":"使适合广大群众需要、为大众普遍接受。","拔节生长":"本义：农作物拔节，茎节迅速向上生长；引申：事物快速成长、蓬勃发展。","遵守":"依照规定、章程、纪律等行动，不违背。","宛然":"副词/形容词：仿佛、好像、逼真，如'宛然在目'；也表示依旧如初。","阐述":"详尽地陈述、论述（观点、原理等）。","合作":"互相配合、共同完成某项工作或任务。","仍然":"副词。表示情况继续不变或恢复原状，相当于'仍旧、依然'，如'问题仍然存在'。","即使":"连词。表示假设的让步，常与'也、还、都'搭配，如'即使下雨也要去'；承认某种情况存在，但结果不受其影响。","而且":"连词。表示递进，常与'不但、不仅、不只'搭配，如'不但聪明而且勤奋'。","几乎":"副词。①表示接近、差不多，如'几乎人人都知道'；②表示差点儿（几乎出了差错）。","恐怕":"副词。①表示估计、推测，语气委婉，如'恐怕要下雨'；②表示担心，如'恐怕不行'。","始终":"副词。自始至终、从头到尾，强调过程一贯不变，如'始终如一'。","甚至":"连词。表示递进到极端或出乎意料的程度，常与'连…都'配合，如'甚至小孩子都懂'。","相反":"连词/副词。引出与前文对立、相反的情况，如'与此相反'。","连":"介词/副词。①强调包含、甚至，如'连老师都答不出'；②表示连续、接连（连喊几声）。","但":"连词。表示转折，相当于'但是、可是'。","然而":"连词。表转折，书面语色彩较浓，相当于'但是'。","因此":"连词。表因果关系，引出结果，相当于'所以'，如'下大雨，因此比赛延期'。","尤其":"副词。表示在同类中特别突出、更进一步，如'大家都很努力，尤其是小李'。","但是":"连词。表转折，口语、书面皆常用，与'但、可是'同义。","只":"副词。①表示仅限于某个范围，如'只有三人到场'；②表示程度（只差一点）。","可是":"连词。表转折，口语常用，如'虽然累，可是很开心'。","特别":"副词/形容词。①格外、尤其，如'特别用心'；②与众不同、专门，如'特别安排'。","一致性":"一致的程度或性质，指各部分相同、没有矛盾冲突。","共通性":"共同具有的性质或特点，指不同事物之间相同相通之处。","普遍性":"广泛存在、适用于多数情况的属性。","逻辑性":"思维或论述条理清楚、符合逻辑规律的性质。","鲜活性":"鲜活的状态，形容内容生动、富有生命力。","客观性":"不以人的意志为转移、按事物本来面目认识的性质。","举步维艰":"迈步都很困难，形容处境艰难，行动极为不便。","习焉不察":"经常接触某种事物反而觉察不到其中问题，指习惯成自然、不加注意。","亦步亦趋":"比喻自己没有主张，或为了讨好而事事模仿、追随别人。","侵占":"非法占有别人或公共的财产、领土等。","剪影":"按人或物的轮廓剪成的图形，也指事物的轮廓或概况。","单一":"只有一种，单纯不复杂。","发掘":"挖掘埋藏之物，比喻发现、找出潜在的事物或人才。","叶公好龙":"比喻口头上说爱好某事物，实际上并不真爱好。","合情合理":"合乎情理，符合人情和道理。","含糊不清":"说话或表达不清楚、不明确。","哗众取宠":"用浮夸的言行迎合众人，以博取好感或支持。","噤若寒蝉":"像深秋的蝉一样不敢出声，比喻因害怕而不敢说话。","培育":"培养幼小生物，引申为培养人才或发展事物。","基石":"做建筑物基础的石头，比喻事业或事物赖以存在发展的根基。","客观":"不带个人偏见，按事物本来面目去认识；也指不依赖主观意识而存在。","宣泄":"排解、发泄（情绪等），使积压的东西释放出来。","寅吃卯粮":"寅年吃了卯年的粮，比喻入不敷出、预先支用以后的收入。","崭露头角":"比喻突出地显示出才能或本领。","底线":"足球等运动场地两端的边线，引申为不可逾越的最低界限或原则。","徐徐":"迟缓、缓慢地。","悠悠":"长久、遥远；也形容悠闲自在、从容不迫。","抱薪救火":"抱着柴草去救火，比喻方法错误，反而使灾害扩大。","挤压":"从四面施加压力，使物体变形或被压缩；比喻排挤、压制。","敷衍塞责":"做事马虎应付、搪塞责任，不尽心尽力。","文过饰非":"用虚假的言辞掩饰自己的过错。","无可厚非":"没有可以过分责难的，指虽有缺点但可以原谅。","普照":"普遍地照射，多形容阳光、恩泽等均匀地施予万物。","杀鸡取卵":"杀了鸡取出蛋，比喻贪图眼前小利而损害长远利益。","标志":"表明特征的记号；也指表明、显示。","模仿":"照着现成的样子学着做。","模糊":"不分明、不清楚；也指混淆、使不清楚。","欲盖弥彰":"想要掩盖事实反而暴露得更明显。","止步":"停止脚步、不再前进。","每况愈下":"情况越来越坏，形容状况逐渐恶化。","江河日下":"江河的水一天天向下流，比喻情况一天天坏下去。","汩汩":"形容水流动的声音或样子。","沙沙":"形容细碎摩擦、拍打的声音（如风吹树叶、雨落地面）。","活跃":"行动积极、气氛热烈；也指使活跃。","温润":"温和滋润；形容气候温和、玉器等光润。","滋养":"供给养分、养育。","滔滔":"形容水势浩大连续不断；也形容话多、连续不停。","滞后":"落在事物发展正常水平的后面，进展迟缓。","澹澹":"水波微微荡漾的样子。","炭岌可危":"应为“岌岌可危”：形容十分危险，快要倒塌或灭亡。","狭窄":"宽度小、范围窄；比喻心胸、见识等不宽广。","理性":"从理智上控制行为、按逻辑分析判断的能力；与“感性”相对。","真实":"跟客观事实相符合，不虚假。","窈窣":"形容细小的摩擦声。","簌簌":"形容风吹叶子等的声音，也形容物体纷纷下落。","粼粼":"形容水石明净、水面清澈闪光的样子。","纯粹":"不掺杂别的成分；单纯、纯正。","绝对":"没有任何条件限制、不受任何限制的；完全、一定。","缓缓":"慢慢地、缓慢地。","落伍":"掉队，比喻跟不上时代或事物发展的步伐。","蚕食":"像蚕吃桑叶那样逐步侵占。","蠢蠢欲动":"比喻敌人或坏人准备进攻或捣乱；也形容急于开始做某事。","袭击":"出其不意地打击、攻击。","视而不见":"看见了却像没看见一样，形容不重视、不关心。","讳疾忌医":"隐瞒疾病、害怕医治，比喻掩饰缺点错误、不愿改正。","跃跃欲试":"形容心里急切地想试一试。","踟蹰":"心里迟疑，要走不走的样子。","迫不及待":"急迫得不能再等待。","闭塞":"交通不便、信息不通；也指思想等保守、不开放。","闭目塞听":"闭上眼睛、堵住耳朵，比喻不接触外界事物、脱离现实。","顺理成章":"写文章或做事顺着条理就能做好，比喻合乎情理、自然产生某种结果。","颇有微词":"有些不满、责备的话。","飒飒":"形容风声、雨声等。","饮鸩止渴":"喝毒酒解渴，比喻只求解决眼前困难而不顾严重后果。","斑驳陆离":"形容色彩杂乱、绚丽多彩。","洪水猛兽":"比喻极大的祸害或害人的事物。","翻天覆地":"形容变化巨大而彻底，也形容闹得很厉害。","莫名其妙":"没有人 // ===== 艾宾浩斯遗忘曲线 - 每日复习计划 =====
// 存储方案：云端 mastery 表字段为主（first_reviewed_at/stage/next_review_date/wrong_count，
// 已在 Supabase 控制台建列并回填 64 条历史）；localStorage 为本地兜底与离线缓存；
// 读取云端优先、本地独有计划上传合并；作答后双写云端+本地。
const REVIEW_INTERVAL = [1, 2, 4, 7, 15, 30]; // stage 0~5 对应间隔（天）
const PLAN_KEY = "ebbinghaus_plan_v1";
const REVIEW_PLAN_VERSION = 1;
let reviewPlanMap = {}; // id -> {first_reviewed_at, stage, next_review_date, wrong_count}（无限循环，无结业）

function reviewTodayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function reviewAddDays(dateStr, n) {
  const parts = String(dateStr).split("-");
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function loadReviewPlan() {
  try {
    const raw = localStorage.getItem(PLAN_KEY);
    if (!raw) return {};
    const data = JSON.parse(raw);
    return (data && typeof data === "object" && !Array.isArray(data)) ? data : {};
  } catch (e) {
    return {};
  }
}
function saveReviewPlan() {
  try {
    localStorage.setItem(PLAN_KEY, JSON.stringify(reviewPlanMap));
  } catch (e) {
    // localStorage 不可用时静默降级
  }
}
function getReviewPlan(id) {
  return reviewPlanMap[id] || null;
}
// 云端行 -> 本地计划对象（云端字段始终有效，无 completed 推断）
function cloudToPlan(r) {
  if (!r || !r.id) return null;
  if (r.first_reviewed_at == null && r.stage == null && r.next_review_date == null && r.wrong_count == null) return null;
  return {
    first_reviewed_at: r.first_reviewed_at || null,
    stage: r.stage == null ? 0 : Number(r.stage),
    next_review_date: r.next_review_date || null,
    wrong_count: r.wrong_count == null ? 0 : Number(r.wrong_count),
  };
}
// 本地计划 -> 云端字段值
function planToCloud(p) {
  return {
    first_reviewed_at: p.first_reviewed_at || null,
    stage: p.stage == null ? 0 : Number(p.stage),
    next_review_date: p.next_review_date || null,
    wrong_count: p.wrong_count == null ? 0 : Number(p.wrong_count),
  };
}
// 写云端 mastery 表字段（双写中的云端侧；失败时本地已保存作为兜底）
function writeServerPlan(id, plan) {
  supabaseClient.from("mastery").update(planToCloud(plan)).eq("id", id).then(function (res) {
    if (res.error) console.warn("复习计划云端写入失败(本地已保存):", res.error.message);
  });
}
// 合并云端与本地计划：云端优先（不一致以云端为准）；云端无计划时上传本地独有计划；
// 两者皆无时从作答记录回填创建（首次打开，避免重复创建）。
function mergeReviewPlansFromMastery(mRows) {
  if (!mRows) return;
  const localHasAny = Object.keys(reviewPlanMap).length > 0;
  const today = reviewTodayStr();
  const merged = {};
  (mRows || []).forEach(function (r) {
    if (!r || !r.id) return;
    const cp = cloudToPlan(r);
    if (cp) {
      merged[r.id] = cp;                 // 云端为准
    } else if (localHasAny && reviewPlanMap[r.id]) {
      merged[r.id] = reviewPlanMap[r.id]; // 本地独有计划：保留并上传合并到云端
      writeServerPlan(r.id, reviewPlanMap[r.id]);
    } else {
      const ts = r.updated_at;
      const base = ts ? String(ts).slice(0, 10) : today;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(base)) return;
      merged[r.id] = {
        first_reviewed_at: base,
        stage: 0,
        next_review_date: reviewAddDays(base, 1),
        wrong_count: 0,
      };
    }
  });
  reviewPlanMap = merged;
  saveReviewPlan();
}
// 作答后更新复习计划（无限循环）：做对 stage+1，走完 30 天（stage=5 做对）重置回 stage 0 开始新一轮；
// 做错重置回第 1 天；首次作答创建计划
function onReviewAnswer(id, correct) {
  const today = reviewTodayStr();
  let p = reviewPlanMap[id];
  if (!p) {
    p = { first_reviewed_at: today, stage: 0, next_review_date: reviewAddDays(today, 1), wrong_count: 0 };
  } else if (correct) {
    const ns = (Number(p.stage) || 0) + 1;
    if (ns >= REVIEW_INTERVAL.length) {
      // 一轮六阶段走完：重置回 stage 0，明天开始新一轮第 1 天；wrong_count 保留累计
      p.stage = 0;
      p.next_review_date = reviewAddDays(today, 1);
    } else {
      p.stage = ns;
      p.next_review_date = reviewAddDays(today, REVIEW_INTERVAL[ns]);
    }
  } else {
    p.stage = 0;
    p.next_review_date = reviewAddDays(today, 1);
    p.wrong_count = (Number(p.wrong_count) || 0) + 1;
  }
  reviewPlanMap[id] = p;
  saveReviewPlan();
  writeServerPlan(id, p);
  updateReviewBanner();
}
function isReviewDue(p, today) {
  if (!p) return false;
  return !!p.next_review_date && p.next_review_date <= today;
}
function dueReviewQuestions(today) {
  return allQuestions.filter(function (q) {
    return isReviewDue(getReviewPlan(q.id), today);
  });
}
function renderReviewPanel() {
  const body = $("#reviewPanelBody");
  if (!body) return;
  const today = reviewTodayStr();
  const due = dueReviewQuestions(today);
  const tip = $("#reviewTip");
  if (tip) {
    const overdue = due.filter(function (q) {
      const p = getReviewPlan(q.id);
      return p && p.next_review_date && p.next_review_date < today;
    }).length;
    tip.textContent = due.length
      ? "共 " + due.length + " 题待复习（含逾期 " + overdue + " 题）。做对推进阶段，做错则重置回第 1 天（明天再次复习）。"
      : "今日全部复习完成，明天再来巩固。";
  }
  if (due.length === 0) {
    body.innerHTML = '<div class="empty">今日复习已完成</div>';
    return;
  }
  const ordered = due.slice().sort(function (a, b) {
    return allQuestions.findIndex(function (x) { return x.id === a.id; }) -
           allQuestions.findIndex(function (x) { return x.id === b.id; });
  });
  body.innerHTML = groupQuestions(ordered).map(renderGroup).join("");
}
function updateReviewBanner() {
  const banner = $("#reviewBanner");
  if (!banner) return;
  const today = reviewTodayStr();
  const due = dueReviewQuestions(today);
  const overdue = due.filter(function (q) {
    const p = getReviewPlan(q.id);
    return p && p.next_review_date && p.next_review_date < today;
  }).length;
  const hasPlan = Object.keys(reviewPlanMap).length > 0;
  banner.style.display = hasPlan ? "" : "none";
  const countEl = $("#reviewCount");
  const overdueEl = $("#reviewOverdue");

  if (due.length > 0) {

    if (doneEl) doneEl.style.display = "none";

    if (overdueEl) overdueEl.style.display = "none";

  const panel = $("#reviewPanel");

}

function $(sel) { return document.querySelector(sel); }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 将命中词典的词用 <span class="dict-word"> 包裹；长词优先、避免重叠、不嵌套。
function wrapDictWords(text) {
  if (!text || !window.IDIOM_DICT) return text;
  const keys = Object.keys(window.IDIOM_DICT).sort(function (a, b) { return b.length - a.length; });
  const ranges = [];
  keys.forEach(function (w) {
    let idx = text.indexOf(w);
    while (idx >= 0) {
      let overlap = false;
      for (let i = 0; i < ranges.length; i++) {
        const r = ranges[i];
        if (idx < r.end && idx + w.length > r.start) { overlap = true; break; }
      }
      if (!overlap) ranges.push({ start: idx, end: idx + w.length, w: w });
      idx = text.indexOf(w, idx + w.length);
    }
  });
  if (!ranges.length) return text;
  ranges.sort(function (a, b) { return a.start - b.start; });
  let out = "", last = 0;
  ranges.forEach(function (r) {
    out += text.slice(last, r.start) + '<span class="dict-word" data-w="' + r.w + '">' + r.w + '</span>';
    last = r.end;
  });
  out += text.slice(last);
  return out;
}

function splitOptions(text) {
  if (!text) return [];
  if (text.indexOf("\n") >= 0) return text.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
  return text.split(/(?=[A-E]\.)/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function splitTrailingQuestion(s) {
  const re = /[。；;\n]/g;
  let m, cut = -1;
  while ((m = re.exec(s)) !== null) cut = m.index;
  const tail = cut < 0 ? s.trim() : s.slice(cut + 1).trim();
  if (tail && /[：:]$/.test(tail)) {
    const head = cut < 0 ? "" : s.slice(0, cut + 1).trim();
    return [head, tail];
  }
  return [s.trim(), ""];
}

// 材料内嵌结构化标记（数据驱动绘制）：![chart:{json}] 柱状图 / ![table:{json}] 表格
// JSON 描述：type/title/unit/xAxis/yMin/yMax/yStep/series[{name,color,stroke,data}] 或 headers/rows
const STRUCT_MARK_RE = /^!\[(chart|table):(\{.*\})\]$/;

function structJsonEsc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// 数据驱动 SVG 柱状图（对齐 PDF 原图：无主标题，左上角"单位：元"，图例右上竖排，
// Y轴10000~50000每10000带小刻度线，无网格线，5年×3柱，柱顶黑色整数标签，X轴下方图标题）
function renderBarChartSVG(spec) {
  const W = 760, H = 420;
  const padL = 70, padR = 24, padT = 64, padB = 70;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const cats = spec.xAxis || [];
  const series = spec.series || [];
  const yMin = spec.yMin, yMax = spec.yMax, yStep = spec.yStep;
  const n = cats.length;
  const groupW = plotW / n;
  const inner = series.length;
  const barW = Math.max(14, Math.min(30, groupW * 0.2));
  const gap = barW * 0.25;
  const total = inner * barW + (inner - 1) * gap;
  const yScale = function (v) { return padT + plotH - (v - yMin) / (yMax - yMin) * plotH; };
  let s = '';
  s += '<svg class="q-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="SimSun,serif">';
  // 坐标轴外框（左/右/上/下）
  s += '<rect x="' + padL + '" y="' + padT + '" width="' + plotW + '" height="' + plotH + '" fill="none" stroke="#000" stroke-width="1"></rect>';
  // 单位（左上角）
  s += '<text x="' + padL + '" y="' + (padT - 24) + '" font-size="15" fill="#000">单位：' + structJsonEsc(spec.unit || "") + '</text>';
  // 图例（右上角竖排；带 stroke 的系列画为折线图例）
  const lgX = W - padR - 120, lgY = padT - 56;
  series.forEach(function (ser, i) {
    const y = lgY + i * 22;
    if (ser.stroke) {
      s += '<line x1="' + lgX + '" y1="' + (y + 8) + '" x2="' + (lgX + 15) + '" y2="' + (y + 8) + '" stroke="' + (ser.strokeColor || "#000") + '" stroke-width="2"></line>';
      s += '<circle cx="' + (lgX + 8) + '" cy="' + (y + 8) + '" r="3" fill="#fff" stroke="#000" stroke-width="1.2"></circle>';
    } else {
      s += '<rect x="' + lgX + '" y="' + y + '" width="15" height="15" fill="' + ser.color + '" stroke="#000" stroke-width="1"></rect>';
    }
    s += '<text x="' + (lgX + 22) + '" y="' + (y + 13) + '" font-size="14" fill="#000">' + structJsonEsc(ser.name) + '</text>';
  });
  // Y轴刻度（左竖线 + 小横线 + 数值）
  for (let v = yMin; v <= yMax + 0.001; v += yStep) {
    const y = yScale(v);
    s += '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + 8) + '" y2="' + y + '" stroke="#000" stroke-width="1"></line>';
    s += '<text x="' + (padL - 8) + '" y="' + (y + 5) + '" font-size="13" text-anchor="end" fill="#000">' + v + '</text>';
  }
  // X轴年份
  cats.forEach(function (cat, ci) {
    const cx = padL + ci * groupW + groupW / 2;
    s += '<text x="' + cx + '" y="' + (H - padB + 26) + '" font-size="14" text-anchor="middle" fill="#000">' + structJsonEsc(cat) + '</text>';
  });
  // 柱体 + 数据标签
  cats.forEach(function (cat, ci) {
    const gx = padL + ci * groupW + (groupW - total) / 2;
    series.forEach(function (ser, si) {
      if (ser.stroke) return; // 折线系列不画柱
      const v = ser.data[ci];
      const bh = (v - yMin) / (yMax - yMin) * plotH;
      const x = gx + si * (barW + gap);
      const y = padT + plotH - bh;
      s += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + bh + '" fill="' + ser.color + '" stroke="#000" stroke-width="1"></rect>';
      s += '<text x="' + (x + barW / 2) + '" y="' + (y - 6) + '" font-size="11" text-anchor="middle" fill="#000">' + v + '</text>';
    });
  });
  // 双轴折线 overlay（带 stroke 的系列映射到右侧 y2 轴）
  const lineSers = series.filter(function (ser) { return !!ser.stroke; });
  if (lineSers.length && spec.y2Max != null && spec.y2Min != null) {
    for (let v = spec.y2Min; v <= spec.y2Max + 0.001; v += spec.y2Step) {
      const y = padT + plotH - (v - spec.y2Min) / (spec.y2Max - spec.y2Min) * plotH;
      s += '<line x1="' + (padL + plotW) + '" y1="' + y + '" x2="' + (padL + plotW - 8) + '" y2="' + y + '" stroke="#000" stroke-width="1"></line>';
      s += '<text x="' + (padL + plotW + 8) + '" y="' + (y + 5) + '" font-size="13" fill="#000">' + v + '</text>';
    }
    lineSers.forEach(function (ser) {
      const pts = (ser.data || []).map(function (v, ci) {
        const x = padL + ci * groupW + groupW / 2;
        const y = padT + plotH - (v - spec.y2Min) / (spec.y2Max - spec.y2Min) * plotH;
        return [x, y];
      });
      let d = "";
      pts.forEach(function (p, i) { d += (i ? " L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); });
      if (pts.length) {
        s += '<path d="' + d + '" fill="none" stroke="' + (ser.strokeColor || "#000") + '" stroke-width="2"></path>';
      }
      pts.forEach(function (p, i) {
        s += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3.5" fill="#fff" stroke="#000" stroke-width="1.5"></circle>';
        s += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 8).toFixed(1) + '" font-size="11" text-anchor="middle" fill="#000">' + ser.data[i] + '</text>';
      });
    });
  }
  // 图标题（X轴下方居中）
  if (spec.title) {
    s += '<text x="' + (padL + plotW / 2) + '" y="' + (H - 14) + '" font-size="15" text-anchor="middle" fill="#000">' + structJsonEsc(spec.title) + '</text>';
  }
  s += '</svg>';
  return s;
}

// 数据驱动 SVG 饼图（对齐 PDF 原图：灰色系扇区 + 引线百分比标签 + 右侧图例 + 下方图标题）
function renderPieChartSVG(spec) {
  const W = 760, H = 420;
  const cx = 250, cy = 195, r = 150;
  const data = (spec.data || []).filter(function (d) { return Number(d.value) > 0; });
  const total = data.reduce(function (acc, d) { return acc + (Number(d.value) || 0); }, 0);
  const colors = ["#C0C0C0", "#FFFFFF", "#646464", "#9E9E9E", "#E0E0E0", "#404040", "#B0B0B0", "#808080"];
  let s = '<svg class="q-chart-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="SimSun,serif">';
  let a0 = -90 * Math.PI / 180;
  data.forEach(function (d, i) {
    const ang = (Number(d.value) || 0) / total * 2 * Math.PI;
    const a1 = a0 + ang;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = ang > Math.PI ? 1 : 0;
    const fill = d.color || colors[i % colors.length];
    s += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1) + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' Z" fill="' + fill + '" stroke="#000" stroke-width="1"></path>';
    const mid = a0 + ang / 2;
    const lx = cx + (r + 16) * Math.cos(mid);
    const ly = cy + (r + 16) * Math.sin(mid);
    const tx = cx + (r + 34) * Math.cos(mid);
    const ty = cy + (r + 34) * Math.sin(mid);
    s += '<line x1="' + lx.toFixed(1) + '" y1="' + ly.toFixed(1) + '" x2="' + tx.toFixed(1) + '" y2="' + ty.toFixed(1) + '" stroke="#000" stroke-width="1"></line>';
    s += '<text x="' + tx.toFixed(1) + '" y="' + (ty + 5).toFixed(1) + '" font-size="13" text-anchor="' + (Math.cos(mid) >= 0 ? "start" : "end") + '" fill="#000">' + d.value + '%</text>';
    a0 = a1;
  });
  // 图例（右侧）
  const lgX = cx + r + 60, lgY = 60;
  data.forEach(function (d, i) {
    const y = lgY + i * 26;
    const fill = d.color || colors[i % colors.length];
    s += '<rect x="' + lgX + '" y="' + y + '" width="15" height="15" fill="' + fill + '" stroke="#000" stroke-width="1"></rect>';
    s += '<text x="' + (lgX + 22) + '" y="' + (y + 13) + '" font-size="14" fill="#000">' + structJsonEsc(d.name) + '  ' + d.value + '%</text>';
  });
  if (spec.title) {
    s += '<text x="' + (cx + 40) + '" y="' + (H - 14) + '" font-size="15" text-anchor="middle" fill="#000">' + structJsonEsc(spec.title) + '</text>';
  }
  s += '</svg>';
  return s;
}

// 数据驱动 HTML 表格（对齐 PDF 原表：指标列左对齐、数值居中、细黑线边框）
function renderStructTableHTML(spec) {
  let s = '<div class="q-struct-table-wrap">';
  if (spec.title) s += '<div class="q-struct-table-title">' + structJsonEsc(spec.title) + '</div>';
  s += '<table class="q-struct-table">';
  const headers = spec.headers || [];
  const rows = spec.rows || [];
  // 表头多行（支持 rowspan/colspan）
  headers.forEach(function (hrow) {
    s += '<tr>';
    hrow.forEach(function (h) {
      const rs = h.rowspan ? ' rowspan="' + h.rowspan + '"' : '';
      const cs = h.colspan ? ' colspan="' + h.colspan + '"' : '';
      s += '<th' + rs + cs + '>' + structJsonEsc(h.text) + '</th>';
    });
    s += '</tr>';
  });
  rows.forEach(function (r) {
    s += '<tr>';
    r.forEach(function (c) { s += '<td>' + structJsonEsc(c) + '</td>'; });
    s += '</tr>';
  });
  s += '</table></div>';
  return s;
}

// 材料内嵌图片标记：![说明](data:image/png;base64,xxx)（与"question 以 data:image 开头=整题图片"约定并存）
const IMG_MARK_RE = /!\[([^\]]*)\]\((data:image\/[^)]+)\)/;

function renderStructuredMaterial(p) {
  const m = p.match(STRUCT_MARK_RE);
  if (!m) return "";
  try {
    const spec = JSON.parse(m[2]);
    if (m[1] === "chart") {
      if (spec.type === "pie") return '<div class="q-figure">' + renderPieChartSVG(spec) + '</div>';
      return '<div class="q-figure">' + renderBarChartSVG(spec) + '</div>';
    }
    if (m[1] === "table") return '<div class="q-figure">' + renderStructTableHTML(spec) + '</div>';
  } catch (e) {
    // JSON 解析失败：原样返回文本，避免前端崩溃
    return "";
  }
  return "";
}

function renderParaWithImages(p, wrap) {
  // 整段仅为结构化标记（chart/table）→ 独立图容器（不缩进）
  if (STRUCT_MARK_RE.test(p)) {
    const h = renderStructuredMaterial(p);
    if (h) return h;
  }
  if (!IMG_MARK_RE.test(p)) {
    return '<div class="q-para">' + wrap(p) + '</div>';
  }
  // 整段仅为一张图片标记 → 独立图容器（不缩进）
  if (/^!\[[^\]]*\]\(data:image\/[^)]+\)$/.test(p)) {
    const alt = p.slice(2, p.indexOf("]("));
    const src = p.slice(p.indexOf("](") + 2, p.length - 1);
    return '<div class="q-figure"><img class="q-material-img" src="' + src + '" alt="' + esc(alt) + '"></div>';
  }
  // 文字中内嵌图片标记 → 拆分为文字段 + img
  const segs = [];
  let rest = p;
  while (rest) {
    const m = rest.match(IMG_MARK_RE);
    if (!m) { segs.push(wrap(rest)); break; }
    if (m.index > 0) segs.push(wrap(rest.slice(0, m.index)));
    segs.push('<img class="q-material-img" src="' + m[2] + '" alt="' + esc(m[1]) + '">');
    rest = rest.slice(m.index + m[0].length);
  }
  return '<div class="q-para">' + segs.join("") + '</div>';
}

// 将 "材料 + 题干" 拆分：材料部分 = 引导语+材料正文（含图片标记），题干 = "N. xxx"
function splitMaterialQuestion(s) {
  const t = String(s == null ? "" : s).replace(/\r/g, "");
  if (!t) return ["", ""];
  if (t.indexOf("data:image") === 0) return ["", t];
  const m = t.match(/\n{2,}\s*(\d{1,2})\s*[.、．]/);
  if (m && m.index > 0) {
    return [t.slice(0, m.index).trim(), t.slice(m.index).replace(/^\n{2,}\s*/, "").trim()];
  }
  return [t, ""];
}

// 分组渲染时题干部分渲染（不含共享材料）
function renderQuestionText(q) {
  const parts = splitMaterialQuestion(q.question || "");
  if (parts[1]) {
    return formatQuestionText(Object.assign({}, q, { question: parts[1] }));
  }
  return formatQuestionText(q);
}

// 按 material_group 聚合（保持筛选后顺序与全局序号）
function groupQuestions(questions) {
  const groups = [];
  const index = new Map();
  questions.forEach(function (q, i) {
    const g = q.material_group;
    if (!g) {
      groups.push({ material_group: "", items: [{ q: q, idx: i }] });
      return;
    }
    if (!index.has(g)) {
      index.set(g, groups.length);
      groups.push({ material_group: g, items: [] });
    }
    groups[index.get(g)].items.push({ q: q, idx: i });
  });
  return groups;
}

function renderGroup(g) {
  // 单题（无共享材料 或 组内仅剩1题）：按原逻辑整卡渲染（材料含在卡片内）
  if (!g.material_group || g.items.length < 2) {
    return g.items.map(function (x) { return renderCard(x.q, x.idx, false); }).join("");
  }
  // 组内>=2题：材料只渲染一次（取全量中该组第一条，保证筛选后材料仍完整）
  const anchor = allQuestions.find(function (q) { return q.material_group === g.material_group; }) || g.items[0].q;
  const parts = splitMaterialQuestion(anchor.question || "");
  const materialHtml = parts[0]
    ? '<div class="group-material">' +
      '<div class="group-material-title">【材料】<button type="button" class="btn btn-outline mat-draw-btn" data-material-group="' + esc(g.material_group) + '" title="在材料上手写圈画（仅手写笔触发）">圈画</button></div>' +
      '<div class="q-text">' + formatQuestionText(Object.assign({}, anchor, { question: parts[0] })) + '</div>' +
      matDrawLayerHtml(g.material_group) +
      '</div>'
    : "";
  const cards = g.items.map(function (x) { return renderCard(x.q, x.idx, true); }).join("");
  return '<div class="question-group">' + materialHtml + '<div class="group-questions">' + cards + '</div></div>';
}

function splitQuestionParas(s) {
  // 申论/长材料按段落重排：优先以空行 \n\n 为段落边界（与数据库修正后的
  // 真实段落结构一致），每段内部再合并物理换行（去 \n 不留空格）；
  // 文本无空行时才退回标点规则，让浏览器自动换行后 justify 可撑满整行。
  const rawParas = s.split(/\n\s*\n/).map(function (p) { return p.trim(); }).filter(function (p) { return p !== ""; });
  if (rawParas.length > 1) {
    const paras = [];
    rawParas.forEach(function (p) {
      const ls = p.split("\n").map(function (ln) { return ln.trim(); }).filter(function (ln) { return ln !== ""; });
      let cur = [];
      function flush() {
        if (cur.length) { paras.push(cur.join("")); cur = []; }
      }
      ls.forEach(function (ln) {
        // 独立成行：模块标题 / 材料标题 / 编号要求子项
        if (/^【[^】]*】$/.test(ln) || /^(材料|给定资料)\d+$/.test(ln) || /^[（(]\d+[）)]/.test(ln)) {
          flush(); paras.push(ln); return;
        }
        cur.push(ln);
      });
      flush();
    });
    return paras;
  }
  // 无空行：退回标点规则
  const lines = s.split("\n").map(function (ln) { return ln.trim(); }).filter(function (ln) { return ln !== ""; });
  const paras = [];
  let cur = [];
  function flush() {
    if (cur.length) { paras.push(cur.join("")); cur = []; }
  }
  lines.forEach(function (ln) {
    if (/^【[^】]*】$/.test(ln) || /^(材料|给定资料)\d+$/.test(ln) || /^[（(]\d+[）)]/.test(ln)) {
      flush(); paras.push(ln); return;
    }
    cur.push(ln);
    if (/[。！？…]$/.test(ln)) flush();
  });
  flush();
  return paras;
}

function joinQuestionLines(parts, useDict) {
  const out = [];
  const wrap = useDict ? function (x) { return wrapDictWords(esc(x)); } : esc;
  parts.forEach(function (s) {
    if (!s) return;
    // 含材料标题 / 空行分隔 / 模块标题+题干 的长文本走段落重排
    if (/(^|\n)(材料|给定资料)\d+\s*$/.test(s) || /\n{2,}/.test(s) || /^【[^】]*】\n/.test(s)) {
      const paras = splitQuestionParas(s);
      out.push(paras.map(function (p) { return renderParaWithImages(p, wrap); }).join(""));
      return;
    }
    // 单行含内嵌图片标记（无空行段落）也走图片渲染
    if (IMG_MARK_RE.test(s)) {
      out.push(renderParaWithImages(s, wrap));
      return;
    }
    out.push(s.split("\n").map(wrap).join("<br>"));
  });
  // 填空横虚线 → 横实线：连续下划线字符渲染为一条实线
  return out.join("<br>").replace(/＿{2,}|_{2,}/g, '<span class="q-blank-line"></span>');
}

function formatQuestionText(q) {
  const useDict = q && q.category === "言语理解与表达";
  const t = String(q.question == null ? "" : q.question).replace(/\r/g, "");
  if (!t) return "";
  if (t.indexOf("data:image") === 0) {
    return '<img class="q-image" src="' + t + '" alt="题目图片">';
  }
  const isSort = /[①②③④⑤⑥⑦⑧⑨⑩]/.test(t) || /排序|语序/.test(t);
  const isBlank = /[＿_]/.test(t) && /填|横线|最恰当/.test(t);
  if (isSort) {
    const parts = t.split(/(?=[①②③④⑤⑥⑦⑧⑨⑩])/).map(function (s) { return s.trim(); }).filter(Boolean);
    const out = [];
    for (let i = 0; i < parts.length; i++) {
      if (i === parts.length - 1) {
        const sp = splitTrailingQuestion(parts[i]);
        if (sp[1]) { out.push(sp[0], sp[1]); } else { out.push(sp[0]); }
      } else {
        out.push(parts[i]);
      }
    }
    return joinQuestionLines(out, useDict);
  }
  const sp = splitTrailingQuestion(t);
  return joinQuestionLines(sp[1] ? [sp[0], sp[1]] : [sp[0]], useDict);
}

function calcStats(questions) {
  const categories = {}, types = {}, reasons = {}, mastery = { "未掌握": 0, "已掌握": 0, "需复习": 0 };
  // 板块 -> 题型 -> 数量（堆叠柱状图数据源）
  const categoriesTypes = {};
  questions.forEach(function (q) {
    const c = q.category || "未分类";
    const t = q.type || "未分类";
    const r = q.error_reason || "未填写";
    categories[c] = (categories[c] || 0) + 1;
    types[t] = (types[t] || 0) + 1;
    reasons[r] = (reasons[r] || 0) + 1;
    const ct = categoriesTypes[c] = categoriesTypes[c] || {};
    ct[t] = (ct[t] || 0) + 1;
    const m = getMastery(q.id);
    if (Object.prototype.hasOwnProperty.call(mastery, m)) mastery[m] += 1;
    else mastery[DEFAULT_MASTERY] += 1;
  });
  return { total: questions.length, categories: categories, types: types, reasons: reasons, mastery: mastery, categoriesTypes: categoriesTypes };
}

function shade(hex, amt) {
  var c = hex.replace("#", "");
  if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
  var num = parseInt(c, 16);
  var r = Math.max(0, Math.min(255, (num >> 16) + amt));
  var g = Math.max(0, Math.min(255, ((num >> 8) & 0xff) + amt));
  var b = Math.max(0, Math.min(255, (num & 0xff) + amt));
  return "rgb(" + r + "," + g + "," + b + ")";
}

function renderPieChart(data) {
  if (!data || Object.keys(data).length === 0) return '<div class="empty">暂无数据</div>';
  const entries = Object.entries(data).sort(function (a, b) { return b[1] - a[1]; }).filter(function (e) { return e[1] > 0; });
  if (entries.length === 0) return '<div class="empty">暂无数据</div>';
  const colors = ["#1D2B4C", "#3B6EF5", "#0EA5E9", "#18A058", "#D98A00", "#E5484D", "#8B5CF6", "#F59E0B"];
  const total = entries.reduce(function (s, e) { return s + e[1]; }, 0);
  const cx = 130, cy = 120, r = 100;
  const activeOf = function (cat) { return state.filters.category === cat ? 1 : 0.35; };
  let paths = "";
  if (entries.length === 1) {
    const cat0 = entries[0][0];
    const col0 = colors[0];
    paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + col0 + '" data-category="' + esc(cat0) + '" opacity="' + activeOf(cat0) + '"></circle>';
  } else {
    let angle = -90;
    entries.forEach(function (e, i) {
      const col = colors[i % colors.length];
      const a = activeOf(e[0]);
      const pct = (e[1] / total) * 360;
      const a1 = angle;
      const a2 = angle + pct;
      const largeArc = (a2 - a1) > 180 ? 1 : 0;
      const x1 = cx + r * Math.cos(a1 * Math.PI / 180);
      const y1 = cy + r * Math.sin(a1 * Math.PI / 180);
      const x2 = cx + r * Math.cos(a2 * Math.PI / 180);
      const y2 = cy + r * Math.sin(a2 * Math.PI / 180);
      paths += '<path d="M ' + cx + ' ' + cy + ' L ' + x1.toFixed(3) + ' ' + y1.toFixed(3) +
        ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2.toFixed(3) + ' ' + y2.toFixed(3) +
        ' Z" fill="' + col + '" stroke="#fff" stroke-width="1.5" data-category="' + esc(e[0]) + '" opacity="' + a + '"></path>';
      angle = a2;
    });
  }
  const legend = entries.map(function (e, i) {
    const pct = total > 0 ? ((e[1] / total) * 100).toFixed(1) : "0.0";
    const activeCls = state.filters.category === e[0] ? " active" : "";
    return '<div class="pie-legend-item' + activeCls + '" data-category="' + esc(e[0]) + '">' +
      '<span class="pie-legend-dot" style="background:' + colors[i % colors.length] + '"></span>' +
      '<span class="pie-legend-name" title="' + esc(e[0]) + '">' + esc(e[0]) + '</span>' +
      '<span class="pie-legend-val">' + e[1] + ' 题 · ' + pct + '%</span>' +
      '</div>';
  }).join("");
  return '<div class="pie-wrap">' +
    '<svg viewBox="0 0 260 240" class="pie-svg" role="img" aria-label="板块错题数饼图">' + paths + '</svg>' +
    '<div class="pie-legend">' + legend + '</div>' +
    '</div>';
}

function renderTypeStats(ct) {
  // 堆叠柱状图：横轴=板块(category)，每板块一根柱子，柱内按题型堆叠分段，
  // 同题型全局同色；题数显示在各柱段内部（仅数字），图例竖排于 SVG 右上角（色块+题型名）。
  const cats = Object.keys(ct || {}).filter(function (c) {
    const tt = ct[c];
    return tt && Object.keys(tt).some(function (t) { return tt[t] > 0; });
  });
  if (cats.length === 0) return '<div class="empty">暂无数据</div>';
  // 全局题型顺序（首次出现顺序），保证同题型同色
  const typeOrder = [], seen = {};
  cats.forEach(function (c) {
    const tt = ct[c];
    Object.keys(tt).forEach(function (t) {
      if (tt[t] > 0 && !seen[t]) { seen[t] = 1; typeOrder.push(t); }
    });
  });
  const totals = cats.map(function (c) {
    let s = 0; const tt = ct[c];
    Object.keys(tt).forEach(function (t) { s += tt[t]; });
    return s;
  });
  const maxTotal = Math.max.apply(null, totals);
  const niceMax = Math.max(5, Math.ceil(maxTotal / 5) * 5);
  const colors = ["#1D2B4C", "#3B6EF5", "#0EA5E9", "#18A058", "#D98A00", "#E5484D", "#8B5CF6", "#F59E0B", "#64748B"];
  const colorOf = function (t) { return colors[typeOrder.indexOf(t) % colors.length]; };
  const W = 520, H = 252, mL = 40, mR = 12, mT = 20, mB = 46;
  const legendX = W - 96;
  const plotW = legendX - mL - 12, plotH = H - mT - mB, baseY = mT + plotH;
  const plotRight = legendX - 8;
  const steps = 4;
  let grid = '';
  for (let s = 0; s <= steps; s++) {
    const val = Math.round((niceMax / steps) * s);
    const y = baseY - (plotH * val / niceMax);
    grid += '<line class="grid-line" x1="' + mL + '" y1="' + y.toFixed(1) + '" x2="' + plotRight + '" y2="' + y.toFixed(1) + '"/>';
    grid += '<text class="tick-label" x="' + (mL - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + val + '</text>';
  }
  const stepW = plotW / cats.length;
  const barW = Math.min(78, stepW * 0.58);
  let bars = '';
  cats.forEach(function (c, i) {
    const x = mL + stepW * i + (stepW - barW) / 2;
    const cx = mL + stepW * i + stepW / 2;
    const total = totals[i];
    const isActive = state.filters.category === c;
    const active = isActive ? " active" : "";
    const types = Object.keys(ct[c]).filter(function (t) { return ct[c][t] > 0; })
      .sort(function (a, b) { return typeOrder.indexOf(a) - typeOrder.indexOf(b); });
    let yCursor = baseY;
    let segs = '';
    types.forEach(function (t) {
      const cnt = ct[c][t];
      const h = Math.max(1.5, (cnt / niceMax) * plotH);
      const y = yCursor - h;
      segs += '<rect class="bar-rect' + active + '" data-category="' + esc(c) + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + h.toFixed(1) + '" fill="' + colorOf(t) + '" opacity="0.94">' +
        '<title>' + esc(c) + ' ' + esc(t) + ' ' + cnt + '/' + total + '</title></rect>';
      // 题数显示：段高足够时居中放段内；小段放段右侧旁边（仅数字，不遮挡）
      if (h >= 13) {
        segs += '<text class="seg-val" x="' + cx.toFixed(1) + '" y="' + (y + h / 2 + 4).toFixed(1) + '">' + cnt + '</text>';
      } else {
        segs += '<text class="seg-val seg-val-side" x="' + (x + barW + 5).toFixed(1) + '" y="' + (y + h / 2 + 3.5).toFixed(1) + '">' + cnt + '</text>';
      }
      yCursor = y;
    });
    bars += '<g>' + segs +
      '<text class="bar-name' + active + '" x="' + cx.toFixed(1) + '" y="' + (baseY + 22).toFixed(1) + '">' + esc(c) + '</text>' +
      '</g>';
  });
  // SVG 右上角竖排图例：色块 + 题型名（不含题数）
  const legend = typeOrder.map(function (t, i) {
    const ly = mT + 2 + i * 18;
    return '<rect class="legend-svg-dot" x="' + legendX + '" y="' + ly + '" width="10" height="10" rx="3" fill="' + colorOf(t) + '"/>' +
      '<text class="legend-svg-text" x="' + (legendX + 16) + '" y="' + (ly + 9) + '">' + esc(t) + '</text>';
  }).join("");
  return '<div class="type-chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="题型分布（板块堆叠柱状图）">' +
    '<line class="axis-line" x1="' + mL + '" y1="' + mT + '" x2="' + mL + '" y2="' + baseY + '"/>' +
    '<line class="axis-line" x1="' + mL + '" y1="' + baseY + '" x2="' + plotRight + '" y2="' + baseY + '"/>' +
    grid + bars + legend + '</svg></div>';
}

function applyFilters() {
  const f = state.filters;
  const kw = f.keyword;
  state.questions = allQuestions.filter(function (q) {
    if (f.category && (q.category || "未分类") !== f.category) return false;
    if (f.type && (q.type || "") !== f.type) return false;
    if (f.mastery && q.mastery !== f.mastery) return false;
    if (kw && !matchesKeyword(q, kw)) return false;
    return true;
  });
  renderList();
}

}

// 圈画工具栏 HTML（题干与材料共用；含画笔粗细滑块 1~8px）

// 材料组圈画层 HTML：按材料组维度独立存储（qdraw_mat_{material_group 编码}），组内所有题共用
function matDrawLayerHtml(mg) {

function setMastery(id, mastery) {

function setAnswerMastery(id, mastery, refreshList) {
  masteryMap[id] = mastery;

  serverStats = null;
  renderStats();
